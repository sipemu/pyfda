[package]
name = "fdars"
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"
description = "Python bindings for fdars-core – Functional Data Analysis in Rust"
authors = ["Simon Mueller"]
repository = "https://github.com/sipemu/pyfda"
homepage = "https://sipemu.github.io/pyfda/"
readme = "README.md"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
fdars-core = { version = "0.14.0", features = ["parallel"] }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }
numpy = "0.28"
