<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img"
     aria-label="Sparse &amp; Irregular Elastic Curves"
     aria-labelledby="sparse-elastic-title sparse-elastic-desc">
  <title id="sparse-elastic-title">Sparse &amp; Irregular Elastic Curves</title>
  <desc id="sparse-elastic-desc">Left: three curves observed at 6, 8 and 11 irregularly placed points, each represented by the polygon through its own points (no interpolation to a common grid). Middle: each polygon has a piecewise-constant square-root velocity, q_k = delta beta over the square root of delta t times the norm of delta beta, on the curve's own parametrisation. Right: the elastic mean is a linear spline in SRV space with knots marked; it is fitted by alternating least squares with re-alignment of every curve, shown as the aligned step functions behind it.</desc>
