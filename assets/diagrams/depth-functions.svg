<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" fill="none" role="img"
     aria-label="Functional Depth: Ranking Curves by Centrality"
     aria-labelledby="depth-functions-title depth-functions-desc">
  <title id="depth-functions-title">Functional Depth: Ranking Curves by Centrality</title>
  <desc id="depth-functions-desc">A multi-panel diagram showing fd.depth(method) assigning a [0,1] centrality score to each curve in a sample — deep curves (blue) are typical and central while shallow curves (red) are peripheral outliers — with a Depth-Based Tools grid below illustrating downstream applications: outlier detection (outliergram, magnitude_shape), functional boxplot, robust statistics (geometric_median, trimmed mean), tolerance bands, and O(T log N) streaming depth.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <defs>
    <marker id="arrDF" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="ttl" x="360" y="30" text-anchor="middle" font-size="20" style="fill:#333">Functional Depth: Ranking Curves by Centrality</text>
  <text class="sub" x="360" y="54" text-anchor="middle" font-size="14" style="fill:#888">Deep curves are typical; shallow curves are outliers</text>

  <!-- ===== Left: Sample of curves ===== -->
  <rect x="16" y="80" width="200" height="200" rx="8" fill="#F8F8F8" stroke="#888" stroke-width="1.5"/>
  <text class="lab" x="116" y="106" text-anchor="middle" font-size="15" style="fill:#555">Curve Sample</text>

  <!-- Central curves (darker) -->
  <path d="M32 180 Q56 158 80 166 Q104 174 128 162 Q152 150 176 160 Q192 166 200 164" stroke="#4A90D9" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M32 186 Q56 164 80 172 Q104 180 128 168 Q152 156 176 166 Q192 172 200 170" stroke="#4A90D9" stroke-width="1.8" fill="none" opacity="0.6"/>
  <path d="M32 192 Q56 170 80 178 Q104 186 128 174 Q152 162 176 172 Q192 178 200 176" stroke="#4A90D9" stroke-width="1.6" fill="none" opacity="0.5"/>
  <!-- Peripheral curves (lighter) -->
  <path d="M32 160 Q56 142 80 148 Q104 154 128 140 Q152 128 176 136 Q192 140 200 138" stroke="#999" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M32 210 Q56 194 80 200 Q104 206 128 196 Q152 186 176 194 Q192 200 200 198" stroke="#999" stroke-width="1.2" fill="none" opacity="0.4"/>
  <!-- Outlier (red) -->
  <path d="M32 130 Q56 120 80 126 Q104 132 128 122 Q152 112 176 118 Q192 124 200 122" stroke="#D55E00" stroke-width="1.5" fill="none" opacity="0.7"/>

  <text class="sm" x="116" y="240" text-anchor="middle" font-size="12" style="fill:#4A90D9">deep = central</text>
  <text class="sm" x="116" y="258" text-anchor="middle" font-size="12" style="fill:#D55E00">shallow = outlier</text>

  <!-- Arrow -->
  <line x1="220" y1="180" x2="268" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrDF)"/>

  <!-- ===== Middle: depth() unified interface ===== -->
  <rect x="276" y="80" width="180" height="200" rx="8" fill="#E8F0FE" stroke="#4A90D9" stroke-width="2"/>
  <text class="lab" x="366" y="108" text-anchor="middle" font-size="16" style="fill:#2C5F8A">fd.depth(method)</text>
  <text class="sm" x="366" y="130" text-anchor="middle" font-size="13" style="fill:#555">Unified interface</text>

  <!-- Method list -->
  <text class="lab" x="296" y="156" font-size="12" style="fill:#2C5F8A">Pointwise:</text>
  <text class="sm" x="300" y="174" style="fill:#555">FM, MBD, BD, MEI</text>
  <text class="lab" x="296" y="198" font-size="12" style="fill:#2C5F8A">Projection:</text>
  <text class="sm" x="300" y="216" style="fill:#555">RP, RT, RPD</text>
  <text class="lab" x="296" y="240" font-size="12" style="fill:#2C5F8A">Kernel/Spatial:</text>
  <text class="sm" x="300" y="258" style="fill:#555">mode, FSD, KFSD</text>

  <!-- Arrow -->
  <line x1="460" y1="180" x2="508" y2="180" stroke="#555" stroke-width="1.5" marker-end="url(#arrDF)"/>

  <!-- ===== Right: Depth values ===== -->
  <rect x="516" y="80" width="188" height="200" rx="8" fill="#F0FAF0" stroke="#2E8B57" stroke-width="2"/>
  <text class="lab" x="610" y="108" text-anchor="middle" font-size="15" style="fill:#2E8B57">Depth Values</text>
  <text class="sm" x="610" y="130" text-anchor="middle" font-size="13" style="fill:#888">[0, 1] per curve</text>

  <!-- Horizontal bar chart showing depth -->
  <rect x="536" y="148" width="140" height="14" rx="2" fill="#2E8B57" opacity="0.8"/>
  <text class="sm" x="534" y="159" text-anchor="end" font-size="10" style="fill:#555">1</text>
  <text class="sm" x="680" y="159" font-size="10" style="fill:#2E8B57">0.92</text>

  <rect x="536" y="168" width="120" height="14" rx="2" fill="#2E8B57" opacity="0.65"/>
  <text class="sm" x="534" y="179" text-anchor="end" font-size="10" style="fill:#555">2</text>
  <text class="sm" x="660" y="179" font-size="10" style="fill:#2E8B57">0.78</text>

  <rect x="536" y="188" width="100" height="14" rx="2" fill="#2E8B57" opacity="0.5"/>
  <text class="sm" x="534" y="199" text-anchor="end" font-size="10" style="fill:#555">3</text>
  <text class="sm" x="640" y="199" font-size="10" style="fill:#2E8B57">0.65</text>

  <rect x="536" y="208" width="70" height="14" rx="2" fill="#E6A020" opacity="0.5"/>
  <text class="sm" x="534" y="219" text-anchor="end" font-size="10" style="fill:#555">4</text>
  <text class="sm" x="610" y="219" font-size="10" style="fill:#E6A020">0.41</text>

  <rect x="536" y="228" width="30" height="14" rx="2" fill="#D55E00" opacity="0.6"/>
  <text class="sm" x="534" y="239" text-anchor="end" font-size="10" style="fill:#555">5</text>
  <text class="sm" x="570" y="239" font-size="10" style="fill:#D55E00">0.12</text>

  <text class="sm" x="610" y="266" text-anchor="middle" font-size="12" style="fill:#888">Rank: central &#8594; outlier</text>

  <!-- ===== Bottom: Applications ===== -->
  <line x1="16" y1="310" x2="704" y2="310" stroke="#eee" stroke-width="1.5"/>
  <text class="lab" x="360" y="338" text-anchor="middle" font-size="15" style="fill:#555">Depth-Based Tools</text>

  <!-- Application boxes -->
  <rect x="24" y="356" width="130" height="72" rx="6" fill="#FFE8E8" stroke="#D55E00" stroke-width="1.2"/>
  <text class="lab" x="89" y="380" text-anchor="middle" style="fill:#D55E00">Outlier Detection</text>
  <text class="sm" x="89" y="398" text-anchor="middle" style="fill:#555">outliergram()</text>
  <text class="sm" x="89" y="414" text-anchor="middle" style="fill:#555">magnitude_shape()</text>

  <rect x="170" y="356" width="130" height="72" rx="6" fill="#F3E8FF" stroke="#7B2D8E" stroke-width="1.2"/>
  <text class="lab" x="235" y="380" text-anchor="middle" style="fill:#7B2D8E">Functional Boxplot</text>
  <text class="sm" x="235" y="398" text-anchor="middle" style="fill:#555">functional boxplot</text>
  <text class="sm" x="235" y="414" text-anchor="middle" style="fill:#555">50% central region</text>

  <rect x="316" y="356" width="130" height="72" rx="6" fill="#F0FAF0" stroke="#2E8B57" stroke-width="1.2"/>
  <text class="lab" x="381" y="380" text-anchor="middle" style="fill:#2E8B57">Robust Statistics</text>
  <text class="sm" x="381" y="398" text-anchor="middle" style="fill:#555">geometric_median(fd)</text>
  <text class="sm" x="381" y="414" text-anchor="middle" style="fill:#555">trimmed mean</text>

  <rect x="462" y="356" width="130" height="72" rx="6" fill="#FFF3E0" stroke="#E6A020" stroke-width="1.2"/>
  <text class="lab" x="527" y="380" text-anchor="middle" style="fill:#B37700">Tolerance Bands</text>
  <text class="sm" x="527" y="398" text-anchor="middle" style="fill:#555">fpca_tolerance_band()</text>
  <text class="sm" x="527" y="414" text-anchor="middle" style="fill:#555">central region</text>

  <rect x="608" y="356" width="96" height="72" rx="6" fill="#E8F0FE" stroke="#4A90D9" stroke-width="1.2"/>
  <text class="lab" x="656" y="380" text-anchor="middle" style="fill:#2C5F8A">Streaming</text>
  <text class="sm" x="656" y="398" text-anchor="middle" style="fill:#555">O(T log N)</text>
  <text class="sm" x="656" y="414" text-anchor="middle" style="fill:#555">per query</text>

  <!-- Bottom summary -->
  <line x1="16" y1="448" x2="704" y2="448" stroke="#eee" stroke-width="1.5"/>
  <text class="lab" x="120" y="474" text-anchor="middle" style="fill:#4A90D9">1D curves</text>
  <text class="sm" x="120" y="494" text-anchor="middle" font-size="12" style="fill:#888">all 11 methods</text>

  <text class="lab" x="360" y="474" text-anchor="middle" style="fill:#4A90D9">2D surfaces</text>
  <text class="sm" x="360" y="494" text-anchor="middle" font-size="12" style="fill:#888">FM, mode, RP, RT, FSD, KFSD</text>

  <text class="lab" x="600" y="474" text-anchor="middle" style="fill:#4A90D9">Rust backend</text>
  <text class="sm" x="600" y="494" text-anchor="middle" font-size="12" style="fill:#888">fast, parallel</text>
</svg>
