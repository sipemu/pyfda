<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img"
     aria-label="Warp Penalties: Four Ways to Measure Roughness"
     aria-labelledby="warp-penalties-title warp-penalties-desc">
  <title id="warp-penalties-title">Warp Penalties: Four Ways to Measure Roughness</title>
  <desc id="warp-penalties-desc">One warp gamma(t) = t + 0.12 sin(2 pi t) and its four penalty integrands: l2gam (gamma' minus 1) squared and l2psi (sqrt gamma' minus 1) squared, which the DP and RBFGS optimisers both support, and roughness (gamma'' squared) and the geodesic angle arccos of the integral of sqrt gamma' squared, which only RBFGS supports.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Warp Penalties: Four Ways to Measure Roughness</text>
  <text class="sub" x="360" y="46" text-anchor="middle">One warp &#947;(t) = t + 0.12&#183;sin 2&#960;t scored by each penalty=&#8230; option, weighted by &#955;</text>

