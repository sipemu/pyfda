<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Equivalence testing: is the mean difference inside a plus-minus delta corridor">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Equivalence Testing: Similar Enough Within ±δ</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Declare equivalence when the whole difference band sits in the corridor</text>

  <!-- Panel 1: two samples -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Two Samples</text>
  <g transform="translate(44,118)">
    <line x1="0" y1="116" x2="156" y2="116" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 66 C40 42 80 86 120 56 C138 44 150 62 156 54" stroke="#3f51b5" stroke-opacity=".5" stroke-width="1.3"/>
    <path d="M0 72 C40 48 80 92 120 62 C138 50 150 68 156 60" stroke="#3f51b5" stroke-opacity=".5" stroke-width="1.3"/>
    <path d="M0 60 C40 36 80 80 120 50 C138 38 150 56 156 48" stroke="#3f51b5" stroke-width="1.9"/>
    <path d="M0 80 C40 56 80 100 120 70 C138 58 150 76 156 68" stroke="#e8710a" stroke-opacity=".5" stroke-width="1.3"/>
    <path d="M0 86 C40 62 80 106 120 76 C138 64 150 82 156 74" stroke="#e8710a" stroke-opacity=".5" stroke-width="1.3"/>
    <path d="M0 74 C40 50 80 94 120 64 C138 52 150 70 156 62" stroke="#e8710a" stroke-width="1.9"/>
    <text class="sm" x="4" y="12" fill="#3f51b5">group 1</text>
    <text class="sm" x="112" y="112" fill="#e8710a">group 2</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#f2ecf9" stroke="#6f42c1" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#6f42c1">equivalence_test()</text>
  <text class="sm" x="360" y="118" text-anchor="middle">TOST + multiplier SCB</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#d9c8ef"/>
    <text class="sm" x="12" y="16">T = sup |μ₁ − μ₂|</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#d9c8ef"/>
    <text class="sm" x="12" y="48">Band vs margin δ</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#d9c8ef"/>
    <text class="sm" x="12" y="80">Bootstrap p-value</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: corridor + verdict -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#f2ecf9" stroke="#6f42c1" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#6f42c1">±δ Corridor</text>
  <g transform="translate(520,110)">
    <rect x="0" y="34" width="156" height="52" fill="#6f42c1" fill-opacity=".10"/>
    <line x1="0" y1="34" x2="156" y2="34" stroke="#6f42c1" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="0" y1="86" x2="156" y2="86" stroke="#6f42c1" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="0" y1="60" x2="156" y2="60" stroke="#adb5bd" stroke-width="1"/>
    <text class="sm" x="156" y="30" text-anchor="end" fill="#6f42c1">+δ</text>
    <text class="sm" x="156" y="98" text-anchor="end" fill="#6f42c1">−δ</text>
    <path d="M0 66 C40 74 80 52 120 62 C138 66 150 58 156 60" fill="none" stroke="#6f42c1" stroke-opacity=".22" stroke-width="10" stroke-linecap="round"/>
    <path d="M0 66 C40 74 80 52 120 62 C138 66 150 58 156 60" fill="none" stroke="#6f42c1" stroke-width="2"/>
  </g>
  <g transform="translate(598,238)">
    <rect x="-52" y="-14" width="104" height="22" rx="11" fill="#198754" fill-opacity=".14"/>
    <text class="sm" x="0" y="1" text-anchor="middle" fill="#198754" font-weight="700">✓ equivalent</text>
  </g>
</svg>
