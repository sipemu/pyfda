<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none"
     role="img" aria-label="Shapelets — discriminative subsequence extraction and GAK kernel"
     aria-labelledby="shap-title shap-desc">
  <title id="shap-title">Shapelets</title>
  <desc id="shap-desc">Shows shapelet discovery: a short discriminative subsequence is extracted from labeled curves, best-match distance to each shapelet transforms every curve into a feature vector, enabling classification by class separation; also shows the GAK Gram matrix used as a precomputed kernel.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>

  <!-- Title -->
  <text class="ttl" x="360" y="30" text-anchor="middle">Shapelets</text>
  <text class="sub" x="360" y="50" text-anchor="middle">Discriminative subsequences for curve classification · GAK precomputed kernel</text>

  <!-- ===== Training curves ===== -->
  <rect x="16" y="64" width="200" height="200" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="116" y="84" text-anchor="middle" fill="#1a1a2e">Training Curves</text>

  <!-- Class 0: sin-family (indigo) -->
  <text class="sm" x="28" y="102" fill="#3f51b5">Class 0</text>
  <path d="M28 145 Q68 95 108 100 Q148 105 208 148" stroke="#3f51b5" stroke-width="2.0" fill="none"/>
  <path d="M28 152 Q68 102 108 107 Q148 112 208 155" stroke="#3f51b5" stroke-width="1.4" fill="none" opacity="0.6"/>
  <path d="M28 148 Q68 98 108 103 Q148 108 208 151" stroke="#3f51b5" stroke-width="1.4" fill="none" opacity="0.5"/>

  <!-- Class 1: cos-family (orange) -->
  <text class="sm" x="28" y="195" fill="#e8710a">Class 1</text>
  <path d="M28 218 Q68 258 108 262 Q148 258 208 218" stroke="#e8710a" stroke-width="2.0" fill="none"/>
  <path d="M28 225 Q68 254 108 258 Q148 254 208 225" stroke="#e8710a" stroke-width="1.4" fill="none" opacity="0.6"/>
  <path d="M28 222 Q68 256 108 260 Q148 256 208 222" stroke="#e8710a" stroke-width="1.4" fill="none" opacity="0.5"/>

  <!-- Shapelet highlight box on class-0 curve -->
  <rect x="68" y="88" width="80" height="60" rx="4" fill="none" stroke="#dc3545" stroke-width="2.0" stroke-dasharray="5,3"/>
  <text class="sm" x="108" y="82" text-anchor="middle" fill="#dc3545">shapelet s₁</text>

  <!-- Arrow: shapelet discovery -->
  <line x1="216" y1="164" x2="252" y2="164" stroke="#495057" stroke-width="2.0" marker-end="url(#arr-shap)"/>

  <!-- ===== Shapelet panel (orange accent) ===== -->
  <rect x="256" y="64" width="200" height="200" rx="10" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="356" y="84" text-anchor="middle" fill="#fd7e14">Shapelet Discovery</text>
  <text class="mono" x="356" y="103" text-anchor="middle" fill="#fd7e14">shapelet_transform_fit(</text>
  <text class="mono" x="356" y="119" text-anchor="middle" fill="#fd7e14">  X, y, quality="info_gain")</text>
  <line x1="268" y1="128" x2="444" y2="128" stroke="#f8d7b8" stroke-width="1.0"/>
  <!-- the shapelet itself as a bold red fragment -->
  <text class="sm" x="268" y="148">Extracted shapelet s₁</text>
  <path d="M268 185 Q310 145 356 150 Q380 155 444 185" stroke="#dc3545" stroke-width="2.8" fill="none"/>
  <text class="sm" x="356" y="212" text-anchor="middle">Best-match distance scoring</text>
  <text class="sm" x="356" y="228" text-anchor="middle">quality: info_gain / f_statistic</text>
  <text class="sm" x="356" y="244" text-anchor="middle">Returns PyShapeletFit handle</text>

  <!-- Arrow: transform -->
  <line x1="456" y1="164" x2="492" y2="164" stroke="#495057" stroke-width="2.0" marker-end="url(#arr-shap)"/>

  <!-- ===== Feature matrix panel ===== -->
  <rect x="496" y="64" width="208" height="200" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="600" y="84" text-anchor="middle" fill="#1a1a2e">Feature Matrix</text>
  <text class="mono" x="600" y="103" text-anchor="middle" fill="#6c757d">shapelet_transform(fit, X_test)</text>
  <text class="sm" x="600" y="120" text-anchor="middle">shape (n_test, K)</text>
  <!-- grid representation of feature matrix -->
  <rect x="520" y="128" width="40" height="28" rx="3" fill="#dce8ff" stroke="#3f51b5" stroke-width="1.0"/>
  <text class="sm" x="540" y="147" text-anchor="middle" fill="#3f51b5">d₁</text>
  <rect x="568" y="128" width="40" height="28" rx="3" fill="#dce8ff" stroke="#3f51b5" stroke-width="1.0"/>
  <text class="sm" x="588" y="147" text-anchor="middle" fill="#3f51b5">d₂</text>
  <rect x="616" y="128" width="40" height="28" rx="3" fill="#dce8ff" stroke="#3f51b5" stroke-width="1.0"/>
  <text class="sm" x="636" y="147" text-anchor="middle" fill="#3f51b5">d₃</text>
  <rect x="520" y="164" width="40" height="28" rx="3" fill="#ffe8d0" stroke="#e8710a" stroke-width="1.0"/>
  <text class="sm" x="540" y="183" text-anchor="middle" fill="#e8710a">d₁</text>
  <rect x="568" y="164" width="40" height="28" rx="3" fill="#ffe8d0" stroke="#e8710a" stroke-width="1.0"/>
  <text class="sm" x="588" y="183" text-anchor="middle" fill="#e8710a">d₂</text>
  <rect x="616" y="164" width="40" height="28" rx="3" fill="#ffe8d0" stroke="#e8710a" stroke-width="1.0"/>
  <text class="sm" x="636" y="183" text-anchor="middle" fill="#e8710a">d₃</text>
  <text class="sm" x="560" y="116" fill="#6c757d">s₁</text>
  <text class="sm" x="608" y="116" fill="#6c757d">s₂</text>
  <text class="sm" x="656" y="116" fill="#6c757d">s₃</text>
  <!-- class separation arrow -->
  <text class="sm" x="600" y="212" text-anchor="middle">Low d → similar to shapelet</text>
  <text class="sm" x="600" y="228" text-anchor="middle">Separates classes by distance split</text>
  <text class="sm" x="600" y="248" text-anchor="middle">→ classifier: knn / lda</text>

  <!-- ===== GAK panel (bottom half) ===== -->
  <rect x="16" y="280" width="392" height="188" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="212" y="300" text-anchor="middle" fill="#1a1a2e">Global Alignment Kernel (GAK)</text>
  <text class="sm" x="212" y="318" text-anchor="middle">Sums all possible alignments between two sequences — produces a PSD kernel</text>
  <text class="mono" x="212" y="338" text-anchor="middle" fill="#6c757d">gak_gram_matrix(X, sigma=sigma_gak(X))</text>
  <!-- Gram matrix heatmap (schematic) -->
  <rect x="28" y="348" width="28" height="28" rx="2" fill="#1a4a9e" opacity="0.9"/>
  <rect x="60" y="348" width="28" height="28" rx="2" fill="#3f51b5" opacity="0.6"/>
  <rect x="92" y="348" width="28" height="28" rx="2" fill="#3f51b5" opacity="0.3"/>
  <rect x="124" y="348" width="28" height="28" rx="2" fill="#e8710a" opacity="0.2"/>
  <rect x="28" y="380" width="28" height="28" rx="2" fill="#3f51b5" opacity="0.6"/>
  <rect x="60" y="380" width="28" height="28" rx="2" fill="#1a4a9e" opacity="0.9"/>
  <rect x="92" y="380" width="28" height="28" rx="2" fill="#3f51b5" opacity="0.4"/>
  <rect x="124" y="380" width="28" height="28" rx="2" fill="#e8710a" stroke="#e8710a" stroke-width="0.5" opacity="0.2"/>
  <rect x="28" y="412" width="28" height="28" rx="2" fill="#3f51b5" opacity="0.3"/>
  <rect x="60" y="412" width="28" height="28" rx="2" fill="#3f51b5" opacity="0.4"/>
  <rect x="92" y="412" width="28" height="28" rx="2" fill="#1a4a9e" opacity="0.9"/>
  <rect x="124" y="412" width="28" height="28" rx="2" fill="#e8710a" opacity="0.2"/>
  <text class="sm" x="170" y="362">K (n, n)</text>
  <text class="sm" x="170" y="382">Unit diagonal</text>
  <text class="sm" x="170" y="402">Symmetric PSD</text>
  <text class="sm" x="170" y="422">Precomputed kernel</text>
  <!-- sigma note -->
  <text class="sm" x="300" y="365">sigma_gak(X) →</text>
  <text class="sm" x="300" y="383">heuristic bandwidth</text>
  <text class="sm" x="300" y="401">(median pairwise dist)</text>
  <text class="sm" x="300" y="425">sklearn-compatible</text>

  <!-- ===== Classifier panel ===== -->
  <rect x="420" y="280" width="284" height="188" rx="10" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="562" y="300" text-anchor="middle" fill="#fd7e14">Shapelet Classifier</text>
  <text class="mono" x="562" y="318" text-anchor="middle" fill="#fd7e14">shapelet_classifier_fit(</text>
  <text class="mono" x="562" y="334" text-anchor="middle" fill="#fd7e14">  X, y, classifier="knn", k=3)</text>
  <line x1="432" y1="344" x2="692" y2="344" stroke="#f8d7b8" stroke-width="1.0"/>
  <text class="sm" x="432" y="364">clf.train_accuracy — training accuracy</text>
  <text class="sm" x="432" y="384">clf.predict(X_new) — class labels</text>
  <text class="sm" x="432" y="404">clf.classes        — label set</text>
  <text class="sm" x="432" y="424">clf.n_classes      — number of classes</text>
  <text class="sm" x="432" y="444">Independent from PyShapeletFit</text>

  <defs>
    <marker id="arr-shap" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7" fill="#495057"/>
    </marker>
  </defs>
</svg>
