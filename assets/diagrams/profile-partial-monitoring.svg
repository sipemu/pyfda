<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Partial-Domain Monitoring: Watch the Interval That Matters" aria-labelledby="t-pmon d-pmon">
  <title id="t-pmon">Partial-Domain Monitoring: Watch the Interval That Matters</title>
  <desc id="d-pmon">Illustrates partial-domain functional monitoring: the Phase I model is fitted on a specific sub-interval of the domain rather than the full curve, and Phase II control limits are applied only to that sub-interval, making the chart more sensitive to deviations in the region that matters most.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Partial-Domain Monitoring: Watch the Interval That Matters</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Slice to a sub-domain so a localised fault no longer averages away</text>

  <!-- Panel 1: curves with highlighted sub-domain -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Curves + Sub-Domain</text>
  <g transform="translate(44,116)">
    <rect x="108" y="0" width="34" height="122" fill="#6610f2" fill-opacity=".10"/>
    <line x1="108" y1="0" x2="108" y2="122" stroke="#6610f2" stroke-width="1" stroke-dasharray="3 3" stroke-opacity=".6"/>
    <line x1="142" y1="0" x2="142" y2="122" stroke="#6610f2" stroke-width="1" stroke-dasharray="3 3" stroke-opacity=".6"/>
    <line x1="0" y1="120" x2="156" y2="120" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 78 C40 54 80 92 108 66 C120 56 132 66 142 62 C150 60 154 66 156 64" stroke="#6c757d" stroke-opacity=".45" stroke-width="1.3"/>
    <path d="M0 88 C40 66 80 100 108 78 C120 68 132 78 142 74 C150 72 154 78 156 76" stroke="#6c757d" stroke-opacity=".45" stroke-width="1.3"/>
    <path d="M0 84 C40 62 80 96 108 72 C118 34 126 30 132 62 C138 84 148 76 156 72" stroke="#6610f2" stroke-width="1.8"/>
    <text class="sm" x="125" y="18" text-anchor="middle" fill="#6610f2">bump</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#f0ebfe" stroke="#6610f2" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#6610f2">spm_phase1()</text>
  <text class="sm" x="360" y="118" text-anchor="middle">on the sliced grid</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#d3c2f9"/>
    <text class="sm" x="12" y="16">Slice argvals [lo, hi]</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#d3c2f9"/>
    <text class="sm" x="12" y="48">Refit FPCA · limits</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#d3c2f9"/>
    <text class="sm" x="12" y="80">spm_monitor partial</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: localized alarm -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#f0ebfe" stroke="#6610f2" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#6610f2">Localised Alarm</text>
  <g transform="translate(520,112)">
    <line x1="0" y1="122" x2="156" y2="122" stroke="#adb5bd" stroke-width="1.2"/>
    <line x1="0" y1="122" x2="0" y2="6" stroke="#adb5bd" stroke-width="1.2"/>
    <line x1="0" y1="40" x2="156" y2="40" stroke="#dc3545" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text class="sm" x="156" y="36" text-anchor="end" fill="#dc3545">UCL</text>
    <polyline points="8,104 30,98 52,106 74,96 96,100 118,92 140,88 152,20" fill="none" stroke="#6610f2" stroke-width="1.8"/>
    <circle cx="8" cy="104" r="2.4" fill="#6610f2"/>
    <circle cx="52" cy="106" r="2.4" fill="#6610f2"/>
    <circle cx="96" cy="100" r="2.4" fill="#6610f2"/>
    <circle cx="152" cy="20" r="5" fill="#dc3545"/>
    <text class="sm" x="152" y="14" text-anchor="middle" fill="#dc3545">alarm</text>
  </g>
  <text class="sm" x="598" y="252" text-anchor="middle" fill="#6c757d">local fault now crosses</text>
</svg>
