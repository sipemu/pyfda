<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Simultaneous Confidence Band — SCB is wider than pointwise CI">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>

  <!-- Title -->
  <text class="ttl" x="360" y="28" text-anchor="middle">Simultaneous Confidence Band vs Pointwise CI</text>
  <text class="sub" x="360" y="46" text-anchor="middle">SCB controls coverage across the entire domain simultaneously — pointwise CI does not</text>

  <!-- Main plot panel -->
  <rect x="40" y="58" width="640" height="200" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="68" y1="72" x2="68" y2="236" stroke="#495057" stroke-width="1.2"/>
  <line x1="68" y1="236" x2="658" y2="236" stroke="#495057" stroke-width="1.2"/>

  <!-- x-axis tick marks (time domain) -->
  <line x1="68"  y1="236" x2="68"  y2="242" stroke="#495057" stroke-width="1.0"/>
  <line x1="215" y1="236" x2="215" y2="242" stroke="#495057" stroke-width="1.0"/>
  <line x1="362" y1="236" x2="362" y2="242" stroke="#495057" stroke-width="1.0"/>
  <line x1="510" y1="236" x2="510" y2="242" stroke="#495057" stroke-width="1.0"/>
  <line x1="658" y1="236" x2="658" y2="242" stroke="#495057" stroke-width="1.0"/>
  <text class="sm" x="68"  y="254" text-anchor="middle">0</text>
  <text class="sm" x="362" y="254" text-anchor="middle">t</text>
  <text class="sm" x="658" y="254" text-anchor="middle">T</text>

  <!-- SCB region (wide, blue) — a smooth symmetric band centred on the mean curve -->
  <!-- Upper SCB boundary -->
  <path d="M68 112 Q160 96 215 100 Q305 108 362 102 Q450 94 510 110 Q580 122 658 118"
        stroke="none" fill="none"/>
  <!-- Lower SCB boundary -->
  <path d="M68 172 Q160 182 215 178 Q305 172 362 168 Q450 178 510 184 Q580 188 658 186"
        stroke="none" fill="none"/>
  <!-- SCB fill -->
  <path d="M68 112 Q160 96 215 100 Q305 108 362 102 Q450 94 510 110 Q580 122 658 118
           L658 186 Q580 188 510 184 Q450 178 362 168 Q305 172 215 178 Q160 182 68 172 Z"
        fill="#3f51b5" opacity="0.18"/>
  <!-- SCB boundary lines -->
  <path d="M68 112 Q160 96 215 100 Q305 108 362 102 Q450 94 510 110 Q580 122 658 118"
        stroke="#3f51b5" stroke-width="1.4" stroke-dasharray="5 3" fill="none"/>
  <path d="M68 172 Q160 182 215 178 Q305 172 362 168 Q450 178 510 184 Q580 188 658 186"
        stroke="#3f51b5" stroke-width="1.4" stroke-dasharray="5 3" fill="none"/>

  <!-- Pointwise CI region (narrower, orange) -->
  <!-- Upper PW boundary (tighter around mean) -->
  <path d="M68 130 Q160 118 215 122 Q305 128 362 124 Q450 118 510 132 Q580 140 658 138"
        stroke="none" fill="none"/>
  <!-- Lower PW boundary -->
  <path d="M68 154 Q160 160 215 157 Q305 153 362 149 Q450 156 510 162 Q580 165 658 163"
        stroke="none" fill="none"/>
  <!-- PW fill -->
  <path d="M68 130 Q160 118 215 122 Q305 128 362 124 Q450 118 510 132 Q580 140 658 138
           L658 163 Q580 165 510 162 Q450 156 362 149 Q305 153 215 157 Q160 160 68 154 Z"
        fill="#e8710a" opacity="0.30"/>
  <!-- PW boundary lines -->
  <path d="M68 130 Q160 118 215 122 Q305 128 362 124 Q450 118 510 132 Q580 140 658 138"
        stroke="#e8710a" stroke-width="1.3" stroke-dasharray="3 3" fill="none"/>
  <path d="M68 154 Q160 160 215 157 Q305 153 362 149 Q450 156 510 162 Q580 165 658 163"
        stroke="#e8710a" stroke-width="1.3" stroke-dasharray="3 3" fill="none"/>

  <!-- Mean curve (solid indigo) -->
  <path d="M68 142 Q160 139 215 140 Q305 141 362 137 Q450 137 510 147 Q580 152 658 150"
        stroke="#3f51b5" stroke-width="2.4" fill="none"/>

  <!-- Labels with arrows -->
  <!-- SCB label -->
  <text class="lab" x="100" y="90" fill="#3f51b5">SCB (95%)</text>
  <text class="sm" x="100" y="104" fill="#3f51b5">simultaneous — wider</text>
  <line x1="100" y1="108" x2="80" y2="118" stroke="#3f51b5" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Pointwise label -->
  <text class="lab" x="430" y="96" fill="#e8710a">Pointwise CI</text>
  <text class="sm" x="430" y="110" fill="#e8710a">per-t only — narrower</text>
  <line x1="448" y1="114" x2="448" y2="128" stroke="#e8710a" stroke-width="1.2" marker-end="url(#arr2)"/>

  <!-- Mean label -->
  <text class="lab" x="586" y="136" fill="#3f51b5">μ̂(t)</text>
  <text class="sm" x="586" y="148" fill="#3f51b5">mean curve</text>

  <!-- Axis labels -->
  <text class="sm" x="28" y="155" text-anchor="middle" transform="rotate(-90,28,155)">value</text>
  <text class="sm" x="362" y="272" text-anchor="middle">domain t</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3f51b5"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e8710a"/>
    </marker>
  </defs>
</svg>
