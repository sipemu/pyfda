<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img"
     aria-label="Bayesian Group Alignment"
     aria-labelledby="bayesian-alignment-title bayesian-alignment-desc">
  <title id="bayesian-alignment-title">Bayesian Group Alignment</title>
  <desc id="bayesian-alignment-desc">Top row: the model. Each warp is the square of the exponential map of a Fourier tangent vector with Gaussian coefficients whose prior sd shrinks with the harmonic; the template SRSF is a quadratic B-spline with a Gaussian prior; the noise variance has an inverse-gamma prior and is drawn exactly by Gibbs. The warped curve SRSFs equal the template plus Gaussian noise. Warps are moved by Z-mixture pCN or infinite-dimensional HMC. Bottom row: a posterior median warp with its 95 percent band, shown as the deviation from the identity; running means of the log-likelihood of four chains, two settling lower, which R-hat and mode_spread flag; and a parallel-tempering ladder of replicas at decreasing inverse temperature that swap states, of which only beta equal to 1 is reported.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Bayesian Group Alignment</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Joint posterior over warps, template and noise by MCMC; several chains and diagnostics</text>
  <rect x="20" y="60" width="230" height="190" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="135" y="82" text-anchor="middle" fill="#495057">priors</text>
  <rect x="32" y="92" width="206" height="44" rx="7" fill="#fff" stroke="#3f51b5" stroke-width="1.3"/>
  <text class="sm" x="42" y="110" fill="#3f51b5" font-weight="700">warps</text>
  <text class="sm" x="98" y="110">c&#7522;&#8342; ~ N(0, (&#963;<tspan dy="3" font-size="8">g</tspan><tspan dy="-3">/j)&#178;)</tspan></text>
  <text class="sm" x="98" y="126" fill="#6c757d">Fourier basis, j &#8804; M</text>
  <rect x="32" y="144" width="206" height="44" rx="7" fill="#fff" stroke="#198754" stroke-width="1.3"/>
  <text class="sm" x="42" y="162" fill="#198754" font-weight="700">template</text>
  <text class="sm" x="98" y="162">q* = &#931; a&#8342; B&#8342;, a&#8342; Gaussian</text>
  <text class="sm" x="98" y="178" fill="#6c757d">quadratic B-spline</text>
  <rect x="32" y="196" width="206" height="44" rx="7" fill="#fff" stroke="#6f42c1" stroke-width="1.3"/>
  <text class="sm" x="42" y="214" fill="#6f42c1" font-weight="700">noise</text>
  <text class="sm" x="98" y="214">&#963;&#178; ~ InvGamma(&#945;&#8320;, &#946;&#8320;)</text>
  <text class="sm" x="98" y="230" fill="#6c757d">exact Gibbs draw</text>
  <path d="M254 155 h10" stroke="#adb5bd" stroke-width="2"/><path d="M264 155 l-9 -5 v10 z" fill="#adb5bd"/>
  <rect x="268" y="60" width="200" height="190" rx="12" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="368" y="82" text-anchor="middle" fill="#fd7e14">warp of curve i</text>
  <text class="mono" x="368" y="106" text-anchor="middle" fill="#495057">v&#7522; = &#931;&#8342; c&#7522;&#8342; &#966;&#8342;</text>
  <text class="sm" x="368" y="121" text-anchor="middle" fill="#6c757d">shooting vector</text>
  <text class="mono" x="368" y="143" text-anchor="middle" fill="#495057">&#968;&#7522; = exp&#8321;(v&#7522;)</text>
  <text class="sm" x="368" y="158" text-anchor="middle" fill="#6c757d">on the Hilbert sphere</text>
  <text class="mono" x="368" y="180" text-anchor="middle" fill="#495057">&#947;&#7522;(t) = &#8747;&#8320;&#7511; &#968;&#7522;&#178;</text>
  <text class="sm" x="368" y="195" text-anchor="middle" fill="#6c757d">monotone warp</text>
  <text class="sm" x="368" y="222" text-anchor="middle" fill="#6c757d">re-centred every</text>
  <text class="mono" x="368" y="237" text-anchor="middle" fill="#6c757d">center_every</text>
  <path d="M472 155 h10" stroke="#adb5bd" stroke-width="2"/><path d="M482 155 l-9 -5 v10 z" fill="#adb5bd"/>
  <rect x="486" y="60" width="214" height="190" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="593" y="82" text-anchor="middle" fill="#495057">likelihood (SRSF space)</text>
  <text class="mono" x="593" y="112" text-anchor="middle" fill="#495057">q&#7522;(&#947;&#7522;(t))&#8730;&#947;&#7522;&#8242;(t)</text>
  <text class="mono" x="593" y="132" text-anchor="middle" fill="#495057">= q*(t) + &#949;,  &#949; ~ N(0, &#963;&#178;)</text>
  <text class="sm" x="593" y="156" text-anchor="middle" fill="#6c757d">q&#7522;: SRSF of observed curve i</text>
  <line x1="502" y1="170" x2="684" y2="170" stroke="#ced4da" stroke-width="1"/>
  <text class="sm" x="593" y="188" text-anchor="middle" font-weight="700">warp moves</text>
  <text class="mono" x="593" y="206" text-anchor="middle" fill="#fd7e14">"pcn" (Z-mixture) | "infhmc"</text>
  <text class="sm" x="593" y="226" text-anchor="middle" fill="#6c757d">infHMC: exact gradient, adapted</text>
  <text class="sm" x="593" y="240" text-anchor="middle" fill="#6c757d">pCN: one Metropolis step per curve</text>
  <rect x="20" y="266" width="216" height="196" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="128.0" y="288" text-anchor="middle" fill="#495057">(a) warp band, one curve</text>
  <line x1="44" y1="410" x2="220" y2="410" stroke="#6c757d" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="44" y1="300" x2="44" y2="410" stroke="#ced4da" stroke-width="1.2"/>
