<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Concurrent (Varying-Coefficient) Regression — predictor curves and their time-varying coefficient curves">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>

  <!-- Title -->
  <text class="ttl" x="360" y="26" text-anchor="middle">Concurrent (Varying-Coefficient) Regression</text>
  <text class="sub" x="360" y="44" text-anchor="middle">Each predictor's effect is a smooth function of t, not a scalar</text>

  <!-- Left panel: predictor curves -->
  <rect x="18" y="56" width="320" height="224" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="178" y="75" text-anchor="middle" fill="#495057">Predictor curves X(t)</text>

  <g transform="translate(38,84)">
    <!-- x-axis -->
    <line x1="0" y1="170" x2="280" y2="170" stroke="#ced4da" stroke-width="1.2"/>
    <!-- y-axis -->
    <line x1="0" y1="0" x2="0" y2="170" stroke="#ced4da" stroke-width="1.2"/>
    <!-- Axis labels -->
    <text class="sm" x="140" y="186" text-anchor="middle">t</text>
    <text class="sm" x="-14" y="86" text-anchor="middle" transform="rotate(-90,-14,86)">X(t)</text>

    <!-- Predictor x1 curves (indigo, several overlapping) -->
    <path d="M0 100 C40 70 80 40 140 50 C200 60 240 80 280 75" stroke="#3f51b5" stroke-width="1.4" opacity="0.4"/>
    <path d="M0 105 C40 72 80 42 140 53 C200 63 240 84 280 79" stroke="#3f51b5" stroke-width="1.4" opacity="0.4"/>
    <path d="M0 95 C40 65 80 38 140 47 C200 57 240 76 280 71" stroke="#3f51b5" stroke-width="1.4" opacity="0.4"/>
    <path d="M0 98 C40 68 80 39 140 49 C200 59 240 79 280 73" stroke="#3f51b5" stroke-width="2.2"/>

    <!-- Predictor x2 curves (orange, several overlapping) -->
    <path d="M0 60 C60 90 120 120 180 110 C220 104 260 90 280 85" stroke="#e8710a" stroke-width="1.4" opacity="0.4"/>
    <path d="M0 55 C60 86 120 116 180 106 C220 100 260 86 280 80" stroke="#e8710a" stroke-width="1.4" opacity="0.4"/>
    <path d="M0 65 C60 95 120 124 180 115 C220 108 260 94 280 89" stroke="#e8710a" stroke-width="1.4" opacity="0.4"/>
    <path d="M0 58 C60 88 120 118 180 108 C220 102 260 88 280 83" stroke="#e8710a" stroke-width="2.2"/>

    <!-- Legend -->
    <line x1="6" y1="148" x2="24" y2="148" stroke="#3f51b5" stroke-width="2.2"/>
    <text class="sm" x="28" y="152" fill="#3f51b5">x₁(t)</text>
    <line x1="80" y1="148" x2="98" y2="148" stroke="#e8710a" stroke-width="2.2"/>
    <text class="sm" x="102" y="152" fill="#e8710a">x₂(t)</text>
  </g>

  <!-- Arrow between panels -->
  <text class="lab" x="360" y="172" text-anchor="middle" fill="#fd7e14">→</text>
  <text class="sm" x="360" y="186" text-anchor="middle">concurrent</text>
  <text class="sm" x="360" y="199" text-anchor="middle">regression</text>

  <!-- Right panel: time-varying coefficient curves -->
  <rect x="382" y="56" width="320" height="224" rx="10" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="542" y="75" text-anchor="middle" fill="#fd7e14">Coefficient curves β(t)</text>

  <g transform="translate(402,84)">
    <!-- x-axis -->
    <line x1="0" y1="170" x2="280" y2="170" stroke="#ced4da" stroke-width="1.2"/>
    <!-- y-axis -->
    <line x1="0" y1="0" x2="0" y2="170" stroke="#ced4da" stroke-width="1.2"/>
    <!-- zero reference -->
    <line x1="0" y1="85" x2="280" y2="85" stroke="#ced4da" stroke-width="1.0" stroke-dasharray="4 3"/>
    <!-- Axis labels -->
    <text class="sm" x="140" y="186" text-anchor="middle">t</text>
    <text class="sm" x="-14" y="86" text-anchor="middle" transform="rotate(-90,-14,86)">β(t)</text>

    <!-- β₁(t) — smooth curve, varies over t (indigo) -->
    <path d="M0 60 C40 50 80 45 140 55 C200 65 240 80 280 90" stroke="#3f51b5" stroke-width="2.6" stroke-linecap="round"/>

    <!-- β₂(t) — smooth curve, different shape (orange) -->
    <path d="M0 120 C50 110 100 95 160 80 C210 67 250 58 280 52" stroke="#e8710a" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Legend -->
    <line x1="6" y1="148" x2="24" y2="148" stroke="#3f51b5" stroke-width="2.6"/>
    <text class="sm" x="28" y="152" fill="#3f51b5">β₁(t)</text>
    <line x1="80" y1="148" x2="98" y2="148" stroke="#e8710a" stroke-width="2.6"/>
    <text class="sm" x="102" y="152" fill="#e8710a">β₂(t)</text>

    <!-- Shape annotation: beta_curve is (p, m) -->
    <text class="mono" x="140" y="20" text-anchor="middle" fill="#6c757d" font-size="10">beta_curve: (p, m)</text>
    <text class="sm" x="140" y="34" text-anchor="middle">p curves, one per predictor</text>
  </g>
</svg>
