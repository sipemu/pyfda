<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Advanced SPM: drift-sensitive charts and fault diagnosis">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Advanced SPM: Catching Drift, Diagnosing the Fault</text>
  <text class="sub" x="360" y="46" text-anchor="middle">EWMA and run rules detect slow drift; contributions locate the cause</text>

  <!-- Panel 1: reference + drift stream -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Reference + Stream</text>
  <text class="sm" x="122" y="112" text-anchor="middle">In-control, then a drift</text>
  <g transform="translate(44,122)">
    <line x1="0" y1="116" x2="156" y2="116" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 74 C40 50 80 92 120 66 C138 54 150 70 156 62" stroke="#6c757d" stroke-opacity=".4" stroke-width="1.3"/>
    <path d="M0 84 C40 62 80 102 120 78 C138 64 150 84 156 74" stroke="#6c757d" stroke-opacity=".4" stroke-width="1.3"/>
    <path d="M0 60 C40 40 80 78 120 44 C138 30 150 48 156 32" stroke="#6610f2" stroke-width="1.8"/>
    <text class="sm" x="120" y="24" fill="#6610f2">drift ↑</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#f0ebfe" stroke="#6610f2" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#6610f2">ewma_scores()</text>
  <text class="sm" x="360" y="118" text-anchor="middle">Drift charts + rules</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#d3c2f9"/>
    <text class="sm" x="12" y="16">EWMA · SPE / Q</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#d3c2f9"/>
    <text class="sm" x="12" y="48">Run rules · ARL</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#d3c2f9"/>
    <text class="sm" x="12" y="80">PC contributions</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: EWMA chart + contribution bars -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#f0ebfe" stroke="#6610f2" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#6610f2">Chart + Diagnosis</text>
  <g transform="translate(516,104)">
    <line x1="0" y1="70" x2="164" y2="70" stroke="#adb5bd" stroke-width="1"/>
    <line x1="0" y1="26" x2="164" y2="26" stroke="#dc3545" stroke-width="1.2" stroke-dasharray="4 3"/>
    <polyline points="6,62 26,58 46,60 66,52 86,46 106,38 126,30 146,18" fill="none" stroke="#6610f2" stroke-width="1.8"/>
    <circle cx="146" cy="18" r="4" fill="#dc3545"/>
  </g>
  <g transform="translate(520,190)">
    <text class="sm" x="0" y="-2" fill="#6c757d">fault contributions</text>
    <rect x="0" y="26" width="18" height="24" rx="2" fill="#6610f2" fill-opacity=".85"/>
    <rect x="26" y="14" width="18" height="36" rx="2" fill="#6610f2" fill-opacity=".85"/>
    <rect x="52" y="34" width="18" height="16" rx="2" fill="#6610f2" fill-opacity=".85"/>
    <rect x="78" y="6" width="18" height="44" rx="2" fill="#dc3545" fill-opacity=".85"/>
    <rect x="104" y="30" width="18" height="20" rx="2" fill="#6610f2" fill-opacity=".85"/>
    <rect x="130" y="40" width="18" height="10" rx="2" fill="#6610f2" fill-opacity=".85"/>
    <text class="sm" x="78" y="-2" text-anchor="middle" fill="#dc3545">PC4</text>
  </g>
</svg>
