<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img"
     aria-label="Landmark Registration: Pinning Features to Targets"
     aria-labelledby="landmark-registration-title landmark-registration-desc">
  <title id="landmark-registration-title">Landmark Registration: Pinning Features to Targets</title>
  <desc id="landmark-registration-desc">landmark_register takes detected landmark times per curve, sets targets to their mean, and warps each curve with a monotone piecewise-cubic Hermite (Fritsch-Carlson) warp gamma_i through the knots (target_k, source_k), so the registered curve f_i(gamma_i(t)) has its landmarks at the targets.</desc>
