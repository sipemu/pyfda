<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 536" fill="none" role="img" aria-label="Choosing an Alignment Method" aria-labelledby="choosing-alignment-title choosing-alignment-desc">
  <title id="choosing-alignment-title">Choosing an Alignment Method</title>
  <desc id="choosing-alignment-desc">Decision tree for picking an fdars alignment method. Q0 asks what one observation is: a curve in R^d leads to curve_shape_*, ab_elastic_distance_pl or sparse_elastic_mean; a discrete time series leads to the DTW family; a real-valued function leads to Q1 on the value type (register_fpca for non-Gaussian or incomplete curves) and Q2 on the phase type, whose leaves are landmark or iterative shift, affine, landmark, landmark-constrained elastic, continuous, elastic Karcher mean, pairwise synchronisation and Bayesian group alignment. Q3 modifiers for noise, size, outliers, periodicity and group comparison (a global test with elastic_phase_amplitude_test, or a localised one with elastic_local_difference_test) apply on top.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Choosing an Alignment Method</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Answer Q0 → Q1 → Q2, then apply the Q3 modifiers; leaves name the fdars.alignment call</text>
  <rect x="12" y="56" width="696" height="26" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="360" y="74" fill="#1a1a2e" text-anchor="middle">Q0 · What is one observation?</text>
  <line x1="122" y1="82" x2="122" y2="96" stroke="#adb5bd" stroke-width="1.2"/>
  <path d="M118 90 L122 96 L126 90" stroke="#adb5bd" stroke-width="1.2"/>
  <line x1="476" y1="82" x2="476" y2="96" stroke="#adb5bd" stroke-width="1.2"/>
  <path d="M472 90 L476 96 L480 90" stroke="#adb5bd" stroke-width="1.2"/>
  <line x1="20" y1="82" x2="20" y2="314" stroke="#adb5bd" stroke-width="1.2"/>
  <line x1="20" y1="314" x2="28" y2="314" stroke="#adb5bd" stroke-width="1.2"/>
  <path d="M24 310 L30 314 L24 318" stroke="#adb5bd" stroke-width="1.2"/>
  <text class="lab" x="122" y="112" fill="#6f42c1" text-anchor="middle">A curve in R^d</text>
  <text class="sm" x="122" y="126" text-anchor="middle">rotation, scale, start = nuisance</text>
  <rect x="30" y="134" width="202" height="86" rx="6" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/>
  <text class="mono" x="38" y="150" fill="#6f42c1">curve_shape_*</text>
  <text class="sm" x="38" y="165">dense, uniformly sampled curves</text>
  <text class="sm" x="38" y="179">closed=True for contours</text>
  <text class="sm" x="38" y="193">warp_optim rbfgs, align_iter ≥ 4</text>
  <text class="sm" x="38" y="211">metric="elastic": bend vs stretch</text>
  <rect x="30" y="226" width="202" height="34" rx="6" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/>
  <text class="mono" x="38" y="241" fill="#6f42c1">ab_elastic_distance_pl</text>
  <text class="sm" x="38" y="254">few-vertex polygon, exact distance</text>
  <rect x="30" y="266" width="202" height="34" rx="6" fill="#ffffff" stroke="#6f42c1" stroke-width="1.5"/>
  <text class="mono" x="38" y="281" fill="#6f42c1">sparse_elastic_mean</text>
  <text class="sm" x="38" y="294">sparse, irregular points per curve</text>
  <text class="lab" x="38" y="318" fill="#6c757d">A discrete time series</text>
  <text class="sm" x="38" y="332">any lengths; goal NN, classify, cluster</text>
  <rect x="30" y="340" width="202" height="50" rx="6" fill="#ffffff" stroke="#6c757d" stroke-width="1.5"/>
  <text class="mono" x="38" y="356" fill="#6c757d">dtw_* / soft_dtw_*</text>
  <text class="sm" x="38" y="371">index paths; a cost, not a metric</text>
  <text class="sm" x="38" y="384">metric / warp model needed? elastic</text>
  <text class="lab" x="30" y="414" fill="#495057">Families</text>
  <rect x="30" y="426" width="10" height="10" rx="2" fill="#ffffff" stroke="#6f42c1" stroke-width="2"/>
  <text class="sm" x="45" y="435">R^d shape</text>
  <rect x="140" y="426" width="10" height="10" rx="2" fill="#ffffff" stroke="#6c757d" stroke-width="2"/>
  <text class="sm" x="155" y="435">time series</text>
  <rect x="30" y="442" width="10" height="10" rx="2" fill="#ffffff" stroke="#dc3545" stroke-width="2"/>
  <text class="sm" x="45" y="451">non-Gaussian</text>
  <rect x="140" y="442" width="10" height="10" rx="2" fill="#ffffff" stroke="#3f51b5" stroke-width="2"/>
  <text class="sm" x="155" y="451">rigid / parametric</text>
  <rect x="30" y="458" width="10" height="10" rx="2" fill="#ffffff" stroke="#e8710a" stroke-width="2"/>
  <text class="sm" x="45" y="467">elastic</text>
  <rect x="140" y="458" width="10" height="10" rx="2" fill="#ffffff" stroke="#198754" stroke-width="2"/>
  <text class="sm" x="155" y="467">Bayesian</text>
  <text class="lab" x="476" y="108" fill="#1a1a2e" text-anchor="middle">A real-valued function on a shared interval</text>
  <rect x="252" y="114" width="456" height="22" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="262" y="129" fill="#1a1a2e">Q1 · What kind of values?</text>
  <line x1="258" y1="136" x2="258" y2="170" stroke="#adb5bd" stroke-width="1.2"/>
  <line x1="258" y1="152" x2="266" y2="152" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="142" width="442" height="22" rx="6" fill="#ffffff" stroke="#dc3545" stroke-width="1.5"/>
  <text class="mono" x="274" y="156" fill="#dc3545">register_fpca(family=…)</text>
  <text class="sm" x="504" y="156">binary, counts, skewed values</text>
  <line x1="258" y1="178" x2="266" y2="178" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="168" width="442" height="34" rx="6" fill="#ffffff" stroke="#dc3545" stroke-width="1.5"/>
  <text class="mono" x="274" y="182" fill="#dc3545">register_fpca(incompleteness=…)</text>
  <text class="sm" x="504" y="182">irregular grids, cut-off curves</text>
  <text class="sm" x="274" y="195">to predict the rest with guarantees: partial conformal</text>
  <line x1="258" y1="202" x2="258" y2="210" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="252" y="208" width="456" height="22" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="262" y="223" fill="#1a1a2e">Dense, Gaussian-ish → Q2 · What does the phase look like?</text>
  <line x1="258" y1="244" x2="266" y2="244" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="234" width="442" height="20" rx="6" fill="#ffffff" stroke="#3f51b5" stroke-width="1.5"/>
  <text class="mono" x="274" y="248" fill="#3f51b5">landmark_shift_registration</text>
  <text class="sm" x="504" y="248">pure offset, one reliable landmark</text>
  <line x1="258" y1="267" x2="266" y2="267" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="257" width="442" height="32" rx="6" fill="#ffffff" stroke="#3f51b5" stroke-width="1.5"/>
  <text class="mono" x="274" y="271" fill="#3f51b5">iterative_shift_registration</text>
  <text class="sm" x="504" y="271">pure offset, no single landmark</text>
  <text class="sm" x="274" y="284">cyclic: extrapolation="periodic"; least-squares shift only as baseline / seed</text>
  <line x1="258" y1="302" x2="266" y2="302" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="292" width="442" height="20" rx="6" fill="#ffffff" stroke="#3f51b5" stroke-width="1.5"/>
  <text class="mono" x="274" y="306" fill="#3f51b5">affine_registration</text>
  <text class="sm" x="504" y="306">offset + uniform speed (tempo)</text>
  <line x1="258" y1="325" x2="266" y2="325" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="315" width="442" height="20" rx="6" fill="#ffffff" stroke="#3f51b5" stroke-width="1.5"/>
  <text class="mono" x="274" y="329" fill="#3f51b5">landmark_register</text>
  <text class="sm" x="504" y="329">named features ARE the phase</text>
  <line x1="258" y1="348" x2="266" y2="348" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="338" width="442" height="32" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5"/>
  <text class="mono" x="274" y="352" fill="#e8710a">elastic_align_pair_constrained_with_config</text>
  <text class="sm" x="274" y="365">pin named features, elastic in between (method="rbfgs" hits them exactly)</text>
  <line x1="258" y1="383" x2="266" y2="383" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="373" width="442" height="20" rx="6" fill="#ffffff" stroke="#3f51b5" stroke-width="1.5"/>
  <text class="mono" x="274" y="387" fill="#3f51b5">continuous_registration</text>
  <text class="sm" x="504" y="387">smooth; amplitude scale varies</text>
  <line x1="258" y1="406" x2="266" y2="406" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="396" width="442" height="20" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5"/>
  <text class="mono" x="274" y="410" fill="#e8710a">karcher_mean_with_config</text>
  <text class="sm" x="504" y="410">general; metric, FPCA, regression</text>
  <line x1="258" y1="429" x2="266" y2="429" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="419" width="442" height="20" rx="6" fill="#ffffff" stroke="#e8710a" stroke-width="1.5"/>
  <text class="mono" x="274" y="433" fill="#e8710a">pairwise_synchronization</text>
  <text class="sm" x="504" y="433">no trustworthy template</text>
  <line x1="258" y1="452" x2="266" y2="452" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="266" y="442" width="442" height="20" rx="6" fill="#ffffff" stroke="#198754" stroke-width="1.5"/>
  <text class="mono" x="274" y="456" fill="#198754">bayesian_align_group</text>
  <text class="sm" x="504" y="456">need warp / template uncertainty</text>
  <line x1="258" y1="230" x2="258" y2="453" stroke="#adb5bd" stroke-width="1.2"/>
  <rect x="12" y="474" width="696" height="56" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="22" y="490" fill="#fd7e14">Q3</text>
  <text class="sm" x="46" y="490">noisy → srsf_presmooth, λ &gt; 0 · large n·m → band_frac, shift or affine · outliers → karcher_median, robust_karcher_mean</text>
  <text class="sm" x="46" y="506">periodic → *_closed, periodic=True, extrapolation="periodic"</text>
  <text class="sm" x="46" y="522">groups → align label-free; whether: elastic_phase_amplitude_test · where: elastic_local_difference_test</text>
</svg>
