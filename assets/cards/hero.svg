<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" fill="none" role="img" aria-label="Functional data curves">
  <defs>
    <linearGradient id="heroBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f51b5" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3f51b5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="heroMean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f51b5"/>
      <stop offset="1" stop-color="#6f42c1"/>
    </linearGradient>
  </defs>
  <!-- axes -->
  <line x1="40" y1="256" x2="528" y2="256" stroke="#3f51b5" stroke-opacity=".28" stroke-width="1.5"/>
  <line x1="40" y1="256" x2="40" y2="30" stroke="#3f51b5" stroke-opacity=".28" stroke-width="1.5"/>
  <!-- confidence band around the mean -->
  <path d="M40 150 C140 78 240 128 320 96 C410 60 480 118 528 84
           L528 132 C480 166 410 108 320 144 C240 176 140 126 40 198 Z" fill="url(#heroBand)"/>
  <!-- curve family in section colors -->
  <path d="M40 176 C140 96 240 168 320 120 C410 66 480 150 528 100" stroke="#0d6efd" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 130 C140 190 240 88 320 150 C410 210 480 92 528 138" stroke="#198754" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 200 C140 140 240 210 320 156 C410 100 480 182 528 150" stroke="#fd7e14" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 112 C140 168 240 100 320 138 C410 176 480 96 528 122" stroke="#dc3545" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 158 C140 108 240 150 320 104 C410 62 480 138 528 92" stroke="#6610f2" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 188 C140 128 240 178 320 132 C410 90 480 160 528 116" stroke="#6f42c1" stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/>
  <!-- mean curve, bold -->
  <path d="M40 150 C140 78 240 128 320 96 C410 60 480 118 528 84" stroke="url(#heroMean)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="40" cy="150" r="6" fill="#3f51b5"/>
  <circle cx="320" cy="96" r="6" fill="#fff" stroke="#6f42c1" stroke-width="3"/>
  <circle cx="528" cy="84" r="6" fill="#6f42c1"/>
</svg>
