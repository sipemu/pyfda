[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fdars"
version = "0.5.0"
description = "Python bindings for fdars – Functional Data Analysis in Rust"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Simon Mueller" },
]
keywords = ["functional-data", "statistics", "fda", "depth", "clustering", "alignment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy", "pandas"]

[project.urls]
Homepage = "https://sipemu.github.io/pyfda/"
Documentation = "https://sipemu.github.io/pyfda/"
Repository = "https://github.com/sipemu/pyfda"
Issues = "https://github.com/sipemu/pyfda/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest", "pyyaml", "matplotlib>=3.6"]
advisor = ["anthropic>=0.72.0", "pydantic>=2.0"]
# Note: mcp requires Python >=3.10. This extra is not compatible with Python 3.9.
mcp = ["mcp>=2.0.0"]

# Provider extras — each ships as an independently installable extra.
# pydantic>=2.0 is repeated in each extra because every adapter needs
# model_json_schema() and model_validate_json(), and we cannot assume
# [advisor] is installed alongside.
# Note: [gemini] requires Python >=3.10 (google-genai SDK requirement);
# the adapter enforces this at runtime with a clear ImportError.
openai = ["openai>=1.40,<2.0", "pydantic>=2.0"]
gemini = ["google-genai>=1.0,<3.0", "pydantic>=2.0"]
ollama = ["ollama>=0.6.2", "pydantic>=2.0"]

# Meta-extra for dev/test environments and documentation examples.
# Includes all provider extras plus the base advisor (Anthropic).
all-providers = [
    "fdars[advisor]",
    "fdars[openai]",
    "fdars[gemini]",
    "fdars[ollama]",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "fdars._native"
# Ship the vendored example CSVs (fdars.datasets) inside the wheel. Globs are
# matched relative to the project root (where the on-disk files live under
# python-source), so the source path is python/fdars/data/*.csv.
include = ["python/fdars/data/*.csv"]
