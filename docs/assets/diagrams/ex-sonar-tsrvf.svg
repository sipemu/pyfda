<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img" aria-label="Validation-First Framework: Three Analysis Paths">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>

  <!-- Title -->
  <text class="ttl" x="360" y="30" text-anchor="middle">Validation-First Framework: Three Analysis Paths</text>
  <text class="sub" x="360" y="52" text-anchor="middle">Test elasticity first — let the data choose the right analysis path</text>

  <!-- Phase 1: Elasticity Check -->
  <rect x="260" y="66" width="200" height="44" rx="6" fill="#F0F0F0" stroke="#999" stroke-width="1.5"/>
  <text class="lab" x="360" y="84" text-anchor="middle" fill="#495057">Phase Elasticity Check</text>
  <text class="sm" x="360" y="100" text-anchor="middle">Phase/Total ratio = 0.31 | Warpings near identity</text>

  <!-- Arrow down to conditioning -->
  <line x1="360" y1="110" x2="360" y2="128" stroke="#666" stroke-width="1.5"/>
  <polygon points="356,124 360,132 364,124" fill="#666"/>

  <!-- Phase 2: Signal Conditioning -->
  <rect x="230" y="132" width="260" height="44" rx="6" fill="#F5F5F5" stroke="#999" stroke-width="1.5"/>
  <text class="lab" x="360" y="150" text-anchor="middle" fill="#495057">Signal Conditioning</text>
  <text class="sm" x="360" y="166" text-anchor="middle">Standardize (scale) + B-spline smooth (25 basis) + Derivatives</text>

  <!-- Three branching arrows -->
  <line x1="280" y1="176" x2="130" y2="212" stroke="#0072B2" stroke-width="2"/>
  <polygon points="128,207 126,216 135,212" fill="#0072B2"/>

  <line x1="360" y1="176" x2="360" y2="212" stroke="#56B4E9" stroke-width="2"/>
  <polygon points="356,208 360,216 364,208" fill="#56B4E9"/>

  <line x1="440" y1="176" x2="590" y2="212" stroke="#D55E00" stroke-width="2"/>
  <polygon points="585,208 594,212 592,203" fill="#D55E00"/>

  <!-- Path A: Simple -->
  <rect x="40" y="216" width="180" height="80" rx="6" fill="#E8F4FD" stroke="#0072B2" stroke-width="2"/>
  <text class="lab" x="130" y="236" text-anchor="middle" fill="#0072B2">Path A: Simple</text>
  <text class="sm" x="130" y="254" text-anchor="middle">Raw (scaled) or Smoothed</text>
  <text class="sm" x="130" y="268" text-anchor="middle">→ FPCA (10 PCs)</text>
  <text class="sm" x="130" y="282" text-anchor="middle">→ kNN / LDA / QDA</text>

  <!-- Path B: Derivative -->
  <rect x="270" y="216" width="180" height="80" rx="6" fill="#EEF7FC" stroke="#56B4E9" stroke-width="2"/>
  <text class="lab" x="360" y="236" text-anchor="middle" fill="#56B4E9">Path B: Derivative</text>
  <text class="sm" x="360" y="254" text-anchor="middle">1st or 2nd derivative</text>
  <text class="sm" x="360" y="268" text-anchor="middle">→ FPCA (15 PCs)</text>
  <text class="sm" x="360" y="282" text-anchor="middle">→ kNN / LDA / QDA</text>

  <!-- Path C: Elastic -->
  <rect x="500" y="216" width="180" height="80" rx="6" fill="#FDE8E0" stroke="#D55E00" stroke-width="2"/>
  <text class="lab" x="590" y="236" text-anchor="middle" fill="#D55E00">Path C: Elastic</text>
  <text class="sm" x="590" y="254" text-anchor="middle">SRSF → Karcher Mean</text>
  <text class="sm" x="590" y="268" text-anchor="middle">→ TSRVF → Amp + Phase PCA</text>
  <text class="sm" x="590" y="282" text-anchor="middle">→ kNN / LDA / QDA</text>

  <!-- Arrows down to results -->
  <line x1="130" y1="296" x2="130" y2="330" stroke="#0072B2" stroke-width="1.5"/>
  <polygon points="126,326 130,334 134,326" fill="#0072B2"/>

  <line x1="360" y1="296" x2="360" y2="330" stroke="#56B4E9" stroke-width="1.5"/>
  <polygon points="356,326 360,334 364,326" fill="#56B4E9"/>

  <line x1="590" y1="296" x2="590" y2="330" stroke="#D55E00" stroke-width="1.5"/>
  <polygon points="586,326 590,334 594,326" fill="#D55E00"/>

  <!-- Results boxes -->
  <rect x="55" y="334" width="150" height="40" rx="6" fill="#0072B2" stroke="none"/>
  <text class="lab" x="130" y="352" text-anchor="middle" fill="white">Smoothed + kNN</text>
  <text class="mono" x="130" y="366" text-anchor="middle" fill="#FFD700">87.0% ★ BEST</text>

  <rect x="285" y="334" width="150" height="40" rx="6" fill="#56B4E9" stroke="none"/>
  <text class="lab" x="360" y="352" text-anchor="middle" fill="white">D1 + kNN</text>
  <text class="mono" x="360" y="366" text-anchor="middle" fill="white">77.7%</text>

  <rect x="515" y="334" width="150" height="40" rx="6" fill="#D55E00" stroke="none"/>
  <text class="lab" x="590" y="352" text-anchor="middle" fill="white">Full elastic + LDA</text>
  <text class="mono" x="590" y="366" text-anchor="middle" fill="white">66.2%</text>

  <!-- Bottom annotation -->
  <text class="sm" x="360" y="404" text-anchor="middle">Phase-rigid data: elastic alignment distorts the physically meaningful frequency axis → accuracy drops 20+ points</text>
</svg>
