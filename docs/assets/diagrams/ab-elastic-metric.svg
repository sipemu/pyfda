<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img"
     aria-label="Elastic (a,b) Metrics: Bending vs Stretching"
     aria-labelledby="ab-elastic-metric-title ab-elastic-metric-desc">
  <title id="ab-elastic-metric-title">Elastic (a,b) Metrics: Bending vs Stretching</title>
  <desc id="ab-elastic-metric-desc">Left: a planar curve with a deformation field h; at one point the arc-length derivative of h is split into a tangential part (stretching, weighted by b squared) and a normal part (bending, weighted by a squared). Right: the first-order elastic metric g equals the integral of a squared times the normal part squared plus b squared times the tangential part squared. The ratio a over 2b sets the trade-off: at 1 (a equals 1, b equals one half) it is the SRVF metric; below 1 bending is cheap relative to stretching, above 1 bending is expensive. fdars computes it through the Kurtek-Needham F-transform, for planar curves only.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Elastic (a,b) Metrics: Bending vs Stretching</text>
  <text class="sub" x="360" y="46" text-anchor="middle">metric="elastic": weight a&#178; on the normal (bending) and b&#178; on the tangential (stretching) part</text>
