  <text class="sm" x="234.7" y="130.3" fill="#e8710a">D&#8347;h</text>
  <text class="sm" x="223.7" y="172.3" fill="#198754">T: stretch (b&#178;)</text>
  <text class="sm" x="105.0" y="107.0" fill="#6f42c1">N: bend (a&#178;)</text>
  <text class="sm" x="174" y="252" text-anchor="middle">grey: field h along c; at one point</text>
  <text class="sm" x="174" y="268" text-anchor="middle">D&#8347;h splits into tangent T and normal N</text>
  <rect x="340" y="62" width="356" height="222" rx="12" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="518" y="84" text-anchor="middle" fill="#fd7e14">first-order elastic metric</text>
  <text class="mono" x="518" y="110" text-anchor="middle" fill="#495057">g = &#8747; a&#178;&#10216;D&#8347;h,N&#10217;&#178; + b&#178;&#10216;D&#8347;h,T&#10217;&#178; ds</text>
  <line x1="370" y1="168" x2="666" y2="168" stroke="#495057" stroke-width="1.5"/>
  <line x1="370.0" y1="163" x2="370.0" y2="173" stroke="#495057" stroke-width="1.2"/>
  <text class="sm" x="370.0" y="187" text-anchor="middle">0.1</text>
  <line x1="518.0" y1="163" x2="518.0" y2="173" stroke="#495057" stroke-width="1.2"/>
  <text class="sm" x="518.0" y="187" text-anchor="middle">1</text>
  <line x1="666.0" y1="163" x2="666.0" y2="173" stroke="#495057" stroke-width="1.2"/>
  <text class="sm" x="666.0" y="187" text-anchor="middle">10</text>
  <circle cx="518.0" cy="168" r="6" fill="#fd7e14"/>
  <text class="sm" x="518.0" y="154" text-anchor="middle" fill="#fd7e14">SRVF: a = 1, b = &#189;</text>
  <text class="lab" x="370" y="154" fill="#495057">&#955; = a/(2b)</text>
  <text class="sm" x="370" y="208" fill="#6f42c1">&#955; &lt; 1: bending cheap,</text>
  <text class="sm" x="370" y="222" fill="#6f42c1">stretching costly</text>
  <text class="sm" x="666" y="208" text-anchor="end" fill="#6f42c1">&#955; &gt; 1: bending</text>
  <text class="sm" x="666" y="222" text-anchor="end" fill="#6f42c1">costly</text>
  <text class="sm" x="518" y="252" text-anchor="middle">planar curves only (d = 2), via the F-transform</text>
  <text class="mono" x="518" y="270" text-anchor="middle" fill="#495057">F(c) = 2b |c&#8242;|^&#189; (c&#8242;/|c&#8242;|)^(a/2b)</text>
</svg>
