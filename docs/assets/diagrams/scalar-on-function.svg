<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Scalar-on-function regression: predictor curves map to a scalar response">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Scalar-on-Function Regression</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Predictor curves X(t) drive a single scalar response ŷ</text>

  <!-- Panel 1: predictor curves -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Predictor Curves X(t)</text>
  <g transform="translate(44,110)">
    <line x1="0" y1="120" x2="156" y2="120" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 80 C40 44 80 98 120 60 C138 44 150 64 156 56" stroke="#6c757d" stroke-opacity=".35" stroke-width="1.6"/>
    <path d="M0 96 C40 66 80 44 120 96 C138 118 150 70 156 88" stroke="#6c757d" stroke-opacity=".35" stroke-width="1.6"/>
    <path d="M0 88 C40 54 80 104 120 70 C138 52 150 76 156 66" stroke="#6c757d" stroke-opacity=".35" stroke-width="1.6"/>
    <path d="M0 84 C40 50 80 96 120 62 C138 46 150 70 156 60" stroke="#495057" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#fdeef0" stroke="#dc3545" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#dc3545">fregre_lm / pls(X, y)</text>
  <text class="sm" x="360" y="118" text-anchor="middle">Reduce, then fit</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#f1c2c8"/>
    <text class="sm" x="12" y="16">FPC · fregre_lm</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#f1c2c8"/>
    <text class="sm" x="12" y="48">PLS · fregre_pls</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#f1c2c8"/>
    <text class="sm" x="12" y="80">Kernel · fregre_np</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: scalar output + beta inset -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#fdeef0" stroke="#dc3545" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#dc3545">Scalar Response ŷ</text>
  <text class="sm" x="598" y="112" text-anchor="middle">one number per curve</text>
  <g transform="translate(520,124)">
    <line x1="18" y1="66" x2="156" y2="66" stroke="#adb5bd" stroke-width="1.2"/>
    <line x1="18" y1="66" x2="18" y2="6" stroke="#adb5bd" stroke-width="1.2"/>
    <line x1="30" y1="60" x2="150" y2="18" stroke="#dc3545" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="46" cy="52" r="3" fill="#dc3545"/>
    <circle cx="74" cy="46" r="3" fill="#dc3545"/>
    <circle cx="100" cy="36" r="3" fill="#dc3545"/>
    <circle cx="126" cy="30" r="3" fill="#dc3545"/>
    <circle cx="140" cy="22" r="3" fill="#dc3545"/>
    <text class="sm" x="88" y="82" text-anchor="middle">fitted vs. actual</text>
  </g>
  <!-- beta(t) inset — coefficient function (the object of interest per page prose) -->
  <g transform="translate(516,206)">
    <rect x="0" y="0" width="164" height="52" rx="6" fill="#fff" stroke="#dc3545" stroke-width="1.5"/>
    <text class="lab" x="8" y="17" fill="#dc3545">β̂(t)</text>
    <text class="sm" x="48" y="17" fill="#6c757d">coefficient function</text>
    <path d="M8 34 C32 18 60 46 90 26 C110 12 138 38 156 22" stroke="#dc3545" stroke-width="2.2" fill="none"/>
  </g>
</svg>
