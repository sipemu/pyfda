<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img"
     aria-label="Shift Registration: Rigid Horizontal Translation"
     aria-labelledby="shift-registration-title shift-registration-desc">
  <title id="shift-registration-title">Shift Registration: Rigid Horizontal Translation</title>
  <desc id="shift-registration-desc">Shift registration moves each curve by one scalar delta: the registered curve is f_i(t minus delta_i), so delta greater than 0 moves it right. The middle panel shows how shift_curves fills the uncovered edge (boundary, linear, periodic, zeros); the right panel shows the iterative Newton loop that re-estimates the template.</desc>
