<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Conformal classification: prediction sets of labels with a coverage guarantee">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Conformal Classification: Prediction Sets</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Return a set of labels that provably contains the true class</text>

  <!-- Panel 1: model + calibration -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Model + Calibration</text>
  <g transform="translate(44,112)">
    <line x1="0" y1="112" x2="156" y2="112" stroke="#adb5bd" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="112" stroke="#adb5bd" stroke-width="1.2"/>
    <line x1="78" y1="0" x2="78" y2="112" stroke="#adb5bd" stroke-dasharray="3 3" stroke-width="1"/>
    <circle cx="24" cy="40" r="3.4" fill="#4a90d9"/>
    <circle cx="44" cy="60" r="3.4" fill="#4a90d9"/>
    <circle cx="34" cy="80" r="3.4" fill="#4a90d9"/>
    <circle cx="112" cy="34" r="3.4" fill="#e8710a"/>
    <circle cx="132" cy="58" r="3.4" fill="#e8710a"/>
    <circle cx="120" cy="82" r="3.4" fill="#e8710a"/>
    <text class="sm" x="8" y="130" fill="#4a90d9">class A</text>
    <text class="sm" x="96" y="130" fill="#e8710a">class B</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#fdeef0" stroke="#dc3545" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#dc3545">conformal_classif()</text>
  <text class="sm" x="360" y="118" text-anchor="middle">Nonconformity scores</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#f1b8bf"/>
    <text class="sm" x="12" y="16">LDA · QDA · kNN</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#f1b8bf"/>
    <text class="sm" x="12" y="48">Logistic wrappers</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#f1b8bf"/>
    <text class="sm" x="12" y="80">P(y∈Ĉ) ≥ 1−α</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: prediction set -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#fdeef0" stroke="#dc3545" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#dc3545">Prediction Set</text>
  <text class="sm" x="598" y="112" text-anchor="middle">confident → 1, ambiguous → many</text>
  <g transform="translate(520,128)">
    <text class="sm" x="0" y="16">confident:</text>
    <rect x="86" y="2" width="34" height="20" rx="6" fill="#dc3545" fill-opacity=".2" stroke="#dc3545"/>
    <text class="sm" x="97" y="16" fill="#dc3545">A</text>
    <text class="sm" x="0" y="56">ambiguous:</text>
    <rect x="86" y="42" width="34" height="20" rx="6" fill="#dc3545" fill-opacity=".2" stroke="#dc3545"/>
    <text class="sm" x="97" y="56" fill="#dc3545">A</text>
    <rect x="124" y="42" width="34" height="20" rx="6" fill="#dc3545" fill-opacity=".2" stroke="#dc3545"/>
    <text class="sm" x="135" y="56" fill="#dc3545">B</text>
    <text class="sm" x="0" y="96" fill="#6c757d">set size honestly</text>
    <text class="sm" x="0" y="110" fill="#6c757d">flags ambiguity</text>
  </g>
</svg>
