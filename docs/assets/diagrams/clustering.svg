<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Functional clustering: partition curves into homogeneous groups">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Functional Clustering: Grouping Curves by Shape</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Minimise within-cluster L² distance to partition a curve sample</text>

  <!-- Panel 1: unlabeled curves -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Unlabeled Curves</text>
  <g transform="translate(44,116)">
    <line x1="0" y1="118" x2="156" y2="118" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 40 C40 28 80 52 120 36 C138 30 150 40 156 34" stroke="#6c757d" stroke-opacity=".5" stroke-width="1.3"/>
    <path d="M0 48 C40 34 80 60 120 44 C138 36 150 48 156 42" stroke="#6c757d" stroke-opacity=".5" stroke-width="1.3"/>
    <path d="M0 44 C40 30 80 56 120 40 C138 32 150 44 156 38" stroke="#6c757d" stroke-opacity=".5" stroke-width="1.3"/>
    <path d="M0 90 C40 76 80 102 120 86 C138 78 150 90 156 84" stroke="#6c757d" stroke-opacity=".5" stroke-width="1.3"/>
    <path d="M0 98 C40 84 80 110 120 94 C138 86 150 98 156 92" stroke="#6c757d" stroke-opacity=".5" stroke-width="1.3"/>
    <path d="M0 94 C40 80 80 106 120 90 C138 82 150 94 156 88" stroke="#6c757d" stroke-opacity=".5" stroke-width="1.3"/>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#f2ecf9" stroke="#6f42c1" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#6f42c1">kmeans_fd()</text>
  <text class="sm" x="360" y="118" text-anchor="middle">Assign · update · repeat</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#d9c8ef"/>
    <text class="sm" x="12" y="16">Hard k-means</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#d9c8ef"/>
    <text class="sm" x="12" y="48">Fuzzy c-means · GMM</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#d9c8ef"/>
    <text class="sm" x="12" y="80">Quality indices → k</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: coloured clusters -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#f2ecf9" stroke="#6f42c1" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#6f42c1">Clustered Curves</text>
  <g transform="translate(520,116)">
    <line x1="0" y1="118" x2="156" y2="118" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 40 C40 28 80 52 120 36 C138 30 150 40 156 34" stroke="#6f42c1" stroke-width="1.6"/>
    <path d="M0 48 C40 34 80 60 120 44 C138 36 150 48 156 42" stroke="#6f42c1" stroke-width="1.6"/>
    <path d="M0 44 C40 30 80 56 120 40 C138 32 150 44 156 38" stroke="#6f42c1" stroke-width="2.4"/>
    <path d="M0 90 C40 76 80 102 120 86 C138 78 150 90 156 84" stroke="#e8710a" stroke-width="1.6"/>
    <path d="M0 98 C40 84 80 110 120 94 C138 86 150 98 156 92" stroke="#e8710a" stroke-width="1.6"/>
    <path d="M0 94 C40 80 80 106 120 90 C138 82 150 94 156 88" stroke="#e8710a" stroke-width="2.4"/>
  </g>
  <text class="sm" x="598" y="252" text-anchor="middle" fill="#6c757d">colour = cluster</text>
</svg>
