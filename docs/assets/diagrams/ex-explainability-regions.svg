<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img" aria-label="Explainability: Recovering Predictive Regions — fregre_lm beta(t) coefficient curve, bootstrap CI, significant_regions, pointwise_importance, functional_saliency, domain_selection, beta_decomposition, functional_pdp">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>

  <!-- Title -->
  <text class="ttl" x="360" y="28" text-anchor="middle">Explainability: Recovering Predictive Regions</text>
  <text class="sub" x="360" y="38" text-anchor="middle">fregre_lm β(λ) coefficient curve · bootstrap_ci → significant_regions · pointwise_importance</text>
  <text class="sub" x="360" y="52" text-anchor="middle">functional_saliency · domain_selection · beta_decomposition · functional_pdp</text>

  <!-- Fit panel -->
  <rect x="24" y="62" width="200" height="70" rx="8" fill="#f0f7ff" stroke="#3f51b5" stroke-width="1.5"/>
  <text class="lab" x="124" y="82" text-anchor="middle" fill="#3f51b5">fregre_lm (n_comp=5)</text>
  <text class="sm" x="124" y="97" text-anchor="middle">Tecator D2 (2nd deriv spectra)</text>
  <text class="sm" x="124" y="111" text-anchor="middle">β(λ) coefficient curve → beta_t</text>

  <!-- Arrow -->
  <line x1="224" y1="97" x2="250" y2="97" stroke="#3f51b5" stroke-width="1.5"/>
  <polygon points="246,93 254,97 246,101" fill="#3f51b5"/>

  <!-- Bootstrap CI panel -->
  <rect x="254" y="62" width="220" height="70" rx="8" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="364" y="82" text-anchor="middle" fill="#fd7e14">bootstrap_ci_fregre_lm</text>
  <text class="sm" x="364" y="97" text-anchor="middle">n_boot=200 · α=0.05 · seed=1</text>
  <text class="sm" x="364" y="112" text-anchor="middle">pointwise 95% CI: lower / upper / center</text>

  <!-- Arrow -->
  <line x1="474" y1="97" x2="500" y2="97" stroke="#fd7e14" stroke-width="1.5"/>
  <polygon points="496,93 504,97 496,101" fill="#fd7e14"/>

  <!-- Significant regions panel -->
  <rect x="504" y="62" width="192" height="70" rx="8" fill="#f0fff4" stroke="#198754" stroke-width="1.5"/>
  <text class="lab" x="600" y="82" text-anchor="middle" fill="#198754">significant_regions</text>
  <text class="sm" x="600" y="97" text-anchor="middle">CI excludes zero → region</text>
  <text class="mono" x="600" y="113" text-anchor="middle" fill="#198754">930 nm C–H band (strongest)</text>

  <!-- Divider -->
  <line x1="40" y1="148" x2="680" y2="148" stroke="#ced4da" stroke-width="1" stroke-dasharray="4,3"/>
  <text class="sub" x="360" y="166" text-anchor="middle">Five independent explanation methods — all point at 930 nm fat-absorption band</text>

  <!-- Row 2: four explainers -->
  <rect x="24" y="176" width="154" height="78" rx="8" fill="#f0f7ff" stroke="#3f51b5" stroke-width="1.5"/>
  <text class="lab" x="101" y="196" text-anchor="middle" fill="#3f51b5">pointwise_importance</text>
  <text class="sm" x="101" y="211" text-anchor="middle">normalized importance</text>
  <text class="sm" x="101" y="225" text-anchor="middle">per FPC at each λ</text>
  <text class="mono" x="101" y="243" text-anchor="middle" fill="#3f51b5">peak: 930 nm</text>

  <rect x="192" y="176" width="154" height="78" rx="8" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="269" y="196" text-anchor="middle" fill="#fd7e14">functional_saliency</text>
  <text class="sm" x="269" y="211" text-anchor="middle">per-sample sensitivity</text>
  <text class="sm" x="269" y="225" text-anchor="middle">linear: ∂ŷ/∂x = β(λ)</text>
  <text class="mono" x="269" y="243" text-anchor="middle" fill="#fd7e14">saliency peak → 930 nm</text>

  <rect x="360" y="176" width="154" height="78" rx="8" fill="#f0fff4" stroke="#198754" stroke-width="1.5"/>
  <text class="lab" x="437" y="196" text-anchor="middle" fill="#198754">domain_selection</text>
  <text class="sm" x="437" y="211" text-anchor="middle">sliding window (w=5)</text>
  <text class="sm" x="437" y="225" text-anchor="middle">accumulates β² mass</text>
  <text class="mono" x="437" y="243" text-anchor="middle" fill="#198754">interval: ~930 nm core</text>

  <rect x="528" y="176" width="168" height="78" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="612" y="196" text-anchor="middle" fill="#495057">beta_decomposition</text>
  <text class="sm" x="612" y="211" text-anchor="middle">per-FPC contribution curves</text>
  <text class="sm" x="612" y="225" text-anchor="middle">sum = β(λ); variance share</text>
  <text class="mono" x="612" y="243" text-anchor="middle" fill="#495057">PC1–PC2 dominate</text>

  <!-- Result converge panel -->
  <rect x="24" y="272" width="672" height="70" rx="8" fill="#198754" stroke="none"/>
  <text class="lab" x="360" y="295" text-anchor="middle" fill="white">All five explainers converge on the same significant bands around 930 nm</text>
  <text class="mono" x="360" y="313" text-anchor="middle" fill="#FFD700">β(λ) + CI · importance · saliency · domain scan · decomposition → 930 nm C–H chemistry</text>
  <text class="sm" x="360" y="330" text-anchor="middle" fill="white">Convergence across independent methods = trustworthy · agreement with known fat absorption = validated</text>

  <!-- PDP panel -->
  <rect x="24" y="360" width="672" height="70" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="360" y="380" text-anchor="middle" fill="#495057">functional_pdp (partial dependence)</text>
  <text class="sm" x="360" y="395" text-anchor="middle">sweep FPC score 0 across its observed range (n_grid=50) → monotone linear response</text>
  <text class="sm" x="360" y="411" text-anchor="middle">dominant mode of spectral shape maps almost linearly to fat → explains why linear model succeeds</text>

  <!-- Bottom note -->
  <text class="sub" x="360" y="444" text-anchor="middle">significant_regions_from_se(beta, se, z_alpha=1.96): CI-route equivalent</text>
  <text class="sub" x="360" y="460" text-anchor="middle">derived se = (upper − lower) / (2 × 1.96) — same result as bootstrap_ci route</text>
</svg>
