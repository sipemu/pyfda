<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="DTW Search: Prune Before You Align" aria-labelledby="dtw-search-title dtw-search-desc">
  <title id="dtw-search-title">DTW Search: Prune Before You Align</title>
  <desc id="dtw-search-desc">Exact DTW nearest-neighbour search compares a query with many reference series. A cascade of cheap lower bounds (LB_Keogh, LB_Kim, LB_Webb) and early-abandoning DTW discards most candidates, so only a few full DTW computations are needed and the result still equals brute force.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">DTW Search: Prune Before You Align</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Cheap lower bounds discard candidates; only the survivors need a full DTW</text>

  <!-- Panel 1: query and references -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Query vs. References</text>
  <g transform="translate(40,106)">
    <path d="M0 30 C20 30 30 6 50 6 C70 6 80 30 100 30 C120 30 140 26 164 26" stroke="#3f51b5" stroke-width="2.4" stroke-linecap="round"/>
    <text class="sm" x="0" y="48" fill="#3f51b5">query</text>
    <g stroke="#6c757d" stroke-width="1.4" stroke-linecap="round" stroke-opacity=".7">
      <path d="M0 74 C30 74 40 58 60 58 C80 58 90 74 164 74"/>
      <path d="M0 90 C60 90 80 78 100 78 C120 78 130 90 164 90"/>
      <path d="M0 106 C14 106 20 94 34 94 C48 94 56 106 164 106"/>
      <path d="M0 122 C40 122 60 110 80 110 C100 110 110 122 164 122"/>
    </g>
    <text class="sm" x="0" y="140">references (n_r of them)</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: cascade -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#eafaf1" stroke="#198754" stroke-width="1.5"/>
  <text class="mono" x="360" y="94" text-anchor="middle" fill="#198754">dtw_nearest_neighbor()</text>
  <text class="sm" x="360" y="112" text-anchor="middle">per candidate, cheapest first</text>
  <g transform="translate(290,120)">
    <rect x="0" y="0" width="140" height="22" rx="6" fill="#fff" stroke="#bfe6d0"/>
    <text class="sm" x="10" y="15">1. LB_Keogh</text>
    <text class="sm" x="130" y="15" text-anchor="end">O(n)</text>
    <rect x="0" y="28" width="140" height="22" rx="6" fill="#fff" stroke="#bfe6d0"/>
    <text class="sm" x="10" y="43">2. LB_Kim</text>
    <text class="sm" x="130" y="43" text-anchor="end">O(1)</text>
    <rect x="0" y="56" width="140" height="22" rx="6" fill="#fff" stroke="#bfe6d0"/>
    <text class="sm" x="10" y="71">3. LB_Webb</text>
    <text class="sm" x="130" y="71" text-anchor="end">O(n)</text>
    <rect x="0" y="84" width="140" height="22" rx="6" fill="#fff" stroke="#198754"/>
    <text class="sm" x="10" y="99">4. early-abandon DTW</text>
  </g>
  <text class="sm" x="360" y="244" text-anchor="middle">bound &gt; best so far → skip</text>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: where candidates stop -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#eafaf1" stroke="#198754" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#198754">Where Candidates Stop</text>
  <text class="sm" x="598" y="112" text-anchor="middle">3 queries × 30 references</text>
  <g transform="translate(516,124)">
    <rect x="0" y="0" width="164" height="18" rx="4" fill="#198754" fill-opacity=".18"/>
    <text class="sm" x="6" y="13">90 pairs</text>
    <rect x="0" y="28" width="112" height="18" rx="4" fill="#198754" fill-opacity=".35"/>
    <text class="sm" x="6" y="41">62 pruned by LB_Keogh</text>
    <rect x="0" y="56" width="29" height="18" rx="4" fill="#198754" fill-opacity=".55"/>
    <text class="sm" x="36" y="69">16 abandoned early</text>
    <rect x="0" y="84" width="22" height="18" rx="4" fill="#198754"/>
    <text class="sm" x="30" y="97">12 full DTW runs</text>
  </g>
  <text class="sm" x="598" y="246" text-anchor="middle">result = brute force, exactly</text>
</svg>
