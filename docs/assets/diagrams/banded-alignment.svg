  <!-- Grid cells: 10 cols × 10 rows, each 20px wide -->
  <!-- Draw inactive cells (outside band) as grey rectangles first -->
  <!-- Band half-width B = 2 (band_frac ~ 0.2 * 10 cells) -->
  <!-- Cell (row i, col j): inside if |i - j| <= 2 -->

  <!-- Row 0 (i=0): j in {0,1,2} active, j in {3..9} grey -->
