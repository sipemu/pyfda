  <rect x="300" y="196" width="20" height="20" fill="#dee2e6" stroke="#ced4da" stroke-width="0.5"/>
  <rect x="320" y="196" width="20" height="20" fill="#dee2e6" stroke="#ced4da" stroke-width="0.5"/>
