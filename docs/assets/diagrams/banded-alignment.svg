<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img" aria-label="Banded elastic alignment: Sakoe-Chiba diagonal corridor constrains the dynamic programming warp path">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="28" text-anchor="middle">Banded Elastic Alignment: Sakoe&#8211;Chiba Corridor</text>
  <text class="sub" x="360" y="48" text-anchor="middle">The warp path is confined to |i&#8722;j| &#8804; B, cutting O(m&#178;) DP work to O(m&#183;B)</text>

  <!-- ======= Top half: DP grid with Sakoe-Chiba band ======= -->
  <!-- Panel background -->
  <rect x="24" y="64" width="672" height="200" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="360" y="86" text-anchor="middle" fill="#495057">DP Cost Table — Sakoe&#8211;Chiba Band (|i&#8722;j| &#8804; B)</text>

