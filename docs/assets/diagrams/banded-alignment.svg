  <rect x="400" y="156" width="20" height="20" fill="#95a8d8" stroke="#ced4da" stroke-width="0.5"/>
  <!-- i=4: j=2..6 -->
  <rect x="340" y="176" width="20" height="20" fill="#dde5f5" stroke="#ced4da" stroke-width="0.5"/>
  <rect x="360" y="176" width="20" height="20" fill="#c5d3ee" stroke="#ced4da" stroke-width="0.5"/>
