  <rect x="520" y="96" width="20" height="20" fill="#dee2e6" stroke="#ced4da" stroke-width="0.5"/>

  <!-- Row 1 (i=1): grey j={0} and j={4..9} -->
  <rect x="280" y="116" width="20" height="20" fill="#dee2e6" stroke="#ced4da" stroke-width="0.5"/>
  <rect x="420" y="116" width="20" height="20" fill="#dee2e6" stroke="#ced4da" stroke-width="0.5"/>
