  <rect x="380" y="96" width="20" height="20" fill="#dee2e6" stroke="#ced4da" stroke-width="0.5"/>
  <rect x="400" y="96" width="20" height="20" fill="#dee2e6" stroke="#ced4da" stroke-width="0.5"/>
  <rect x="420" y="96" width="20" height="20" fill="#dee2e6" stroke="#ced4da" stroke-width="0.5"/>
  <rect x="440" y="96" width="20" height="20" fill="#dee2e6" stroke="#ced4da" stroke-width="0.5"/>
  <rect x="460" y="96" width="20" height="20" fill="#dee2e6" stroke="#ced4da" stroke-width="0.5"/>
