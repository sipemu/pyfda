<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img"
     aria-label="Elastic Warp Optimisers: DP Lattice, Pruning and RBFGS"
     aria-labelledby="elastic-optimisers-title elastic-optimisers-desc">
  <title id="elastic-optimisers-title">Elastic Warp Optimisers: DP Lattice, Pruning and RBFGS</title>
  <desc id="elastic-optimisers-desc">Left: the dynamic-programming lattice with the 35 coprime moves of nbhd_dim=7 (slopes 1/7 to 7) fanned from one node, a Sakoe-Chiba band and an optimal monotone path. Middle: exact pruning skips a predecessor whose cost already exceeds the target's, giving bit-identical warps. Right: RBFGS optimises psi = sqrt(gamma') on the unit sphere, starting from a coarse DP seed; penalised runs also restart from the identity.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
