<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Covariance functions: a kernel choice yields a covariance surface and sample paths">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Covariance Functions: From Kernel to Sample Paths</text>
  <text class="sub" x="360" y="46" text-anchor="middle">A kernel sets the correlation structure that shapes drawn curves</text>

  <!-- Panel 1: kernel choice -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Kernel Choice</text>
  <text class="sm" x="122" y="112" text-anchor="middle">C(s, t) with ℓ, σ²</text>
  <g transform="translate(44,124)">
    <rect x="0" y="4" width="156" height="22" rx="6" fill="#fff" stroke="#ced4da"/>
    <text class="sm" x="12" y="19">Gaussian (smooth)</text>
    <rect x="0" y="32" width="156" height="22" rx="6" fill="#fff" stroke="#ced4da"/>
    <text class="sm" x="12" y="47">Exponential (rough)</text>
    <rect x="0" y="60" width="156" height="22" rx="6" fill="#fff" stroke="#ced4da"/>
    <text class="sm" x="12" y="75">Matérn</text>
    <rect x="0" y="88" width="156" height="22" rx="6" fill="#fff" stroke="#ced4da"/>
    <text class="sm" x="12" y="103">Periodic</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#f2ecf9" stroke="#6f42c1" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#6f42c1">covariance_matrix()</text>
  <text class="sm" x="360" y="118" text-anchor="middle">Build C, then sample</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#d9c8ef"/>
    <text class="sm" x="12" y="16">Evaluate on grid</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#d9c8ef"/>
    <text class="sm" x="12" y="48">Cholesky factor</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#d9c8ef"/>
    <text class="sm" x="12" y="80">simulate_gp draws</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: surface + sample paths -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#f2ecf9" stroke="#6f42c1" stroke-width="1.5"/>
  <text class="lab" x="598" y="90" text-anchor="middle" fill="#6f42c1">Surface + Paths</text>
  <g transform="translate(520,100)">
    <g>
      <rect x="0" y="0" width="64" height="64" fill="#6f42c1" fill-opacity=".08"/>
      <path d="M0 0 L64 64" stroke="#6f42c1" stroke-opacity=".7" stroke-width="6"/>
      <path d="M0 14 L50 64 M14 0 L64 50" stroke="#6f42c1" stroke-opacity=".4" stroke-width="3"/>
      <path d="M0 30 L34 64 M30 0 L64 34" stroke="#6f42c1" stroke-opacity=".18" stroke-width="3"/>
      <rect x="0" y="0" width="64" height="64" fill="none" stroke="#c9b6e6"/>
      <text class="sm" x="32" y="78" text-anchor="middle" fill="#6c757d">C(s,t)</text>
    </g>
    <g transform="translate(84,0)">
      <line x1="0" y1="66" x2="72" y2="66" stroke="#adb5bd" stroke-width="1"/>
      <path d="M0 40 C18 20 30 52 44 34 C54 22 64 42 72 30" stroke="#6f42c1" stroke-width="1.6" fill="none"/>
      <path d="M0 48 C18 60 30 30 44 50 C54 62 64 38 72 52" stroke="#e8710a" stroke-width="1.6" fill="none"/>
      <path d="M0 32 C18 44 30 18 44 40 C54 52 64 24 72 40" stroke="#3f51b5" stroke-width="1.6" fill="none"/>
      <text class="sm" x="36" y="80" text-anchor="middle" fill="#6c757d">GP draws</text>
    </g>
  </g>
</svg>
