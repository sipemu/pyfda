<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img" aria-label="Tecator Spectra Inline Quality Monitoring — SPM Phase I FPCA baseline, Phase II T2 and SPE control charts, EWMA, per-PC contributions">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>

  <!-- Title -->
  <text class="ttl" x="360" y="28" text-anchor="middle">Tecator Spectra: Inline Quality Monitoring</text>
  <text class="sub" x="360" y="38" text-anchor="middle">spm_phase1 + select_ncomp builds FPCA baseline · spm_monitor flags out-of-spec</text>
  <text class="sub" x="360" y="52" text-anchor="middle">ewma_scores + run rules + t2_pc_contributions diagnose alarm cause</text>

  <!-- Dataset panel -->
  <rect x="24" y="62" width="200" height="70" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="124" y="82" text-anchor="middle" fill="#495057">Tecator (raw absorbance)</text>
  <text class="sm" x="124" y="97" text-anchor="middle">in-spec: fat &lt; 25% (most batches)</text>
  <text class="sm" x="124" y="111" text-anchor="middle">out-of-spec: fat ≥ 25%</text>

  <!-- Arrow to Phase I -->
  <line x1="224" y1="97" x2="250" y2="97" stroke="#666" stroke-width="1.5"/>
  <polygon points="246,93 254,97 246,101" fill="#666"/>

  <!-- Phase I panel -->
  <rect x="254" y="62" width="286" height="70" rx="8" fill="#f0f7ff" stroke="#3f51b5" stroke-width="1.5"/>
  <text class="lab" x="397" y="82" text-anchor="middle" fill="#3f51b5">Phase I — FPCA calibration</text>
  <text class="sm" x="397" y="97" text-anchor="middle">spm_phase1(in-spec, wl, ncomp=10, α=0.01)</text>
  <text class="sm" x="397" y="112" text-anchor="middle">select_ncomp(eig, "cumulative_variance", 0.90) → 1 PC</text>

  <!-- Arrow to limits -->
  <line x1="540" y1="97" x2="566" y2="97" stroke="#3f51b5" stroke-width="1.5"/>
  <polygon points="562,93 570,97 562,101" fill="#3f51b5"/>

  <!-- Control limits panel -->
  <rect x="570" y="62" width="126" height="70" rx="8" fill="#f0f7ff" stroke="#3f51b5" stroke-width="1.5"/>
  <text class="lab" x="633" y="82" text-anchor="middle" fill="#3f51b5">Control limits</text>
  <text class="sm" x="633" y="97" text-anchor="middle">T² UCL (α=0.01)</text>
  <text class="sm" x="633" y="112" text-anchor="middle">SPE UCL (α=0.01)</text>

  <!-- Divider -->
  <line x1="40" y1="148" x2="680" y2="148" stroke="#ced4da" stroke-width="1" stroke-dasharray="4,3"/>
  <text class="sub" x="360" y="166" text-anchor="middle">Phase II — monitoring out-of-spec stream</text>

  <!-- spm_monitor panel -->
  <rect x="24" y="176" width="220" height="80" rx="8" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="134" y="196" text-anchor="middle" fill="#fd7e14">spm_monitor</text>
  <text class="sm" x="134" y="211" text-anchor="middle">project each spectrum onto Phase I</text>
  <text class="sm" x="134" y="225" text-anchor="middle">T² + SPE vs UCL → alarm flags</text>
  <text class="mono" x="134" y="243" text-anchor="middle" fill="#fd7e14">Shewhart: UCL crossings</text>

  <!-- Run rules panel -->
  <rect x="260" y="176" width="200" height="80" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="360" y="196" text-anchor="middle" fill="#495057">Run rules</text>
  <text class="sm" x="360" y="211" text-anchor="middle">western_electric_rules</text>
  <text class="sm" x="360" y="225" text-anchor="middle">nelson_rules</text>
  <text class="sm" x="360" y="243" text-anchor="middle">WE1 (3σ): dominant · WE4 + Nelson5</text>

  <!-- EWMA panel -->
  <rect x="476" y="176" width="220" height="80" rx="8" fill="#f0fff4" stroke="#198754" stroke-width="1.5"/>
  <text class="lab" x="586" y="196" text-anchor="middle" fill="#198754">ewma_scores (λ=0.2)</text>
  <text class="sm" x="586" y="211" text-anchor="middle">smooth FPC-score vectors</text>
  <text class="sm" x="586" y="225" text-anchor="middle">MEWMA-type statistic vs UCL</text>
  <text class="sm" x="586" y="243" text-anchor="middle">catches clustered moderate shifts</text>

  <!-- Arrow down from spm_monitor -->
  <line x1="134" y1="256" x2="134" y2="296" stroke="#fd7e14" stroke-width="1.5"/>
  <polygon points="130,292 134,300 138,292" fill="#fd7e14"/>

  <!-- Arrow down from EWMA -->
  <line x1="586" y1="256" x2="586" y2="296" stroke="#198754" stroke-width="1.5"/>
  <polygon points="582,292 586,300 590,292" fill="#198754"/>

  <!-- Diagnosis panel -->
  <rect x="24" y="300" width="672" height="78" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="360" y="320" text-anchor="middle" fill="#495057">Fault diagnosis — t2_pc_contributions</text>
  <text class="sm" x="360" y="336" text-anchor="middle">T² = Σ cₖ · cₖ = ξₖ²/λₖ  per-PC contribution identifies the dominant mode</text>
  <text class="sm" x="360" y="351" text-anchor="middle">worst sample: PC3 dominates (~40), PC2 next (~26) — fat fault lives in shape modes, not PC1 (level)</text>
  <text class="sm" x="360" y="366" text-anchor="middle">heatmap of contrib (nobs × ncomp) points engineer toward 930–1000 nm fat-absorption region</text>

  <!-- Bottom note -->
  <text class="sub" x="360" y="416" text-anchor="middle">Pipeline: in-spec baselines → FPCA limits → Shewhart + run rules + EWMA monitoring</text>
  <text class="sub" x="360" y="432" text-anchor="middle">→ per-PC contributions trace the alarm back to the spectral absorption region</text>
</svg>
