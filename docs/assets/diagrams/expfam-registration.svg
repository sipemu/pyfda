<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img"
     aria-label="Exponential-Family Registration (registr)"
     aria-labelledby="expfam-registration-title expfam-registration-desc">
  <title id="expfam-registration-title">Exponential-Family Registration (registr)</title>
  <desc id="expfam-registration-desc">Top row: binary observations of three subjects (ticks at 1 above, at 0 below the line) come from latent logit-scale curves that are misaligned in time; register_fpca estimates for each curve the inverse warp h_i inverse, so that g of E Y_i at observed time t star equals theta_i at h_i inverse of t star, and the fitted latent curves line up on registered time. Bottom row: the algorithm starts from a spline-GLM template and a per-curve likelihood warp fitted by L-BFGS over monotone B-spline coefficients, then alternates generalised FPCA (variational EM or two-step) with re-registration of each curve to its own fit Theta transpose (alpha + psi s_i). A side panel contrasts a complete-curve warp with fixed ends and an incomplete curve whose trailing end is free, penalised by lambda_inc.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
