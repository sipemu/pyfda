<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Andrews transformation: from feature tables to curves">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Andrews Transformation: Tables to Curves</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Encode each feature vector as a Fourier series, then use the fdars toolbox</text>

  <!-- Panel 1: feature table -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Feature Table</text>
  <text class="sm" x="122" y="112" text-anchor="middle">rows = observations</text>
  <g transform="translate(48,124)">
    <!-- grid -->
    <g stroke="#ced4da" stroke-width="1">
      <line x1="0" y1="0" x2="148" y2="0"/><line x1="0" y1="26" x2="148" y2="26"/>
      <line x1="0" y1="52" x2="148" y2="52"/><line x1="0" y1="78" x2="148" y2="78"/>
      <line x1="0" y1="104" x2="148" y2="104"/>
      <line x1="0" y1="0" x2="0" y2="104"/><line x1="37" y1="0" x2="37" y2="104"/>
      <line x1="74" y1="0" x2="74" y2="104"/><line x1="111" y1="0" x2="111" y2="104"/>
      <line x1="148" y1="0" x2="148" y2="104"/>
    </g>
    <g font="600 10px ui-monospace,monospace" fill="#495057">
      <text x="8" y="18">x1</text><text x="45" y="18">x2</text><text x="82" y="18">x3</text><text x="119" y="18">x4</text>
    </g>
    <g fill="#6c757d" font="400 9px ui-monospace,monospace">
      <text x="8" y="44">.4</text><text x="45" y="44">.9</text><text x="82" y="44">.1</text><text x="119" y="44">.6</text>
      <text x="8" y="70">.7</text><text x="45" y="70">.2</text><text x="82" y="70">.8</text><text x="119" y="70">.3</text>
      <text x="8" y="96">.2</text><text x="45" y="96">.5</text><text x="82" y="96">.4</text><text x="119" y="96">.9</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#eafaf1" stroke="#198754" stroke-width="1.5"/>
  <text class="lab" x="360" y="96" text-anchor="middle" fill="#198754">Andrews Transform</text>
  <text class="mono" x="360" y="150" text-anchor="middle" fill="#198754" font-size="11">x1/&#8730;2 + x2 sin t</text>
  <text class="mono" x="360" y="170" text-anchor="middle" fill="#198754" font-size="11">+ x3 cos t + ...</text>
  <text class="sm" x="360" y="200" text-anchor="middle" font-size="10">Fourier series in t</text>
  <text class="sm" x="360" y="216" text-anchor="middle" font-size="10">$t\in[-\pi,\pi]$</text>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: output -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#eafaf1" stroke="#198754" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#198754">One Curve per Row</text>
  <g transform="translate(516,116)">
    <line x1="0" y1="60" x2="164" y2="60" stroke="#adb5bd" stroke-width="1.2"/>
    <line x1="82" y1="10" x2="82" y2="118" stroke="#adb5bd" stroke-width="1"/>
    <path d="M0 40 C40 8 60 96 82 60 C110 18 140 84 164 44" stroke="#198754" stroke-width="1.8"/>
    <path d="M0 72 C40 46 60 30 82 66 C110 96 140 40 164 70" stroke="#fd7e14" stroke-width="1.8"/>
    <path d="M0 56 C40 84 60 24 82 52 C110 72 140 62 164 56" stroke="#0d6efd" stroke-width="1.8"/>
    <text class="sm" x="82" y="132" text-anchor="middle" font-size="9">$-\pi \quad\quad 0 \quad\quad \pi$</text>
  </g>
</svg>
