<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Tolerance Bands vs Conformal Bands — fpca_tolerance_band FPCA bootstrap vs conformal_prediction_band distribution-free, both at 90% coverage on Canadian weather curves, efficiency vs robustness trade-off">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>

  <!-- Title -->
  <text class="ttl" x="360" y="28" text-anchor="middle">Tolerance Bands vs Conformal Bands</text>
  <text class="sub" x="360" y="38" text-anchor="middle">load_canadian_weather · fpca_tolerance_band (FPCA bootstrap) vs conformal_prediction_band</text>
  <text class="sub" x="360" y="52" text-anchor="middle">same 90% coverage target · efficiency vs robustness trade-off</text>

  <!-- Dataset panel -->
  <rect x="24" y="62" width="168" height="70" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="108" y="82" text-anchor="middle" fill="#495057">load_canadian_weather</text>
  <text class="sm" x="108" y="97" text-anchor="middle">35 stations · 365 days</text>
  <text class="sm" x="108" y="111" text-anchor="middle">temperature curves · seasonal</text>

  <!-- Arrow -->
  <line x1="192" y1="97" x2="218" y2="97" stroke="#666" stroke-width="1.5"/>
  <polygon points="214,93 222,97 214,101" fill="#666"/>

  <!-- FPCA tolerance panel -->
  <rect x="222" y="62" width="218" height="70" rx="8" fill="#f0f7ff" stroke="#3f51b5" stroke-width="1.5"/>
  <text class="lab" x="331" y="82" text-anchor="middle" fill="#3f51b5">fpca_tolerance_band</text>
  <text class="sm" x="331" y="97" text-anchor="middle">ncomp=4 · nb=600 bootstrap reps</text>
  <text class="sm" x="331" y="111" text-anchor="middle">coverage=0.90 · model-based width</text>

  <!-- Arrow (fork) -->
  <line x1="440" y1="97" x2="466" y2="97" stroke="#3f51b5" stroke-width="1.5"/>
  <polygon points="462,93 470,97 462,101" fill="#3f51b5"/>

  <!-- Conformal band panel -->
  <rect x="470" y="62" width="226" height="70" rx="8" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="583" y="82" text-anchor="middle" fill="#fd7e14">conformal_prediction_band</text>
  <text class="sm" x="583" y="97" text-anchor="middle">cal_fraction=0.25 · coverage=0.90</text>
  <text class="sm" x="583" y="111" text-anchor="middle">distribution-free · calibrated from residuals</text>

  <!-- Divider -->
  <line x1="40" y1="148" x2="680" y2="148" stroke="#ced4da" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Result: FPCA band -->
  <rect x="24" y="160" width="312" height="78" rx="8" fill="#3f51b5" stroke="none"/>
  <text class="lab" x="180" y="180" text-anchor="middle" fill="white">FPCA tolerance band — tighter</text>
  <text class="mono" x="180" y="198" text-anchor="middle" fill="#FFD700">coverage ≥ 0.90 · mean half-width: smaller</text>
  <text class="sm" x="180" y="214" text-anchor="middle" style="fill:white">efficient when FPCA model fits well</text>
  <text class="sm" x="180" y="228" text-anchor="middle" style="fill:white">both bands breathe wider in winter</text>

  <!-- Result: conformal band -->
  <rect x="384" y="160" width="312" height="78" rx="8" fill="#fd7e14" stroke="none"/>
  <text class="lab" x="540" y="180" text-anchor="middle" fill="white">Conformal band — outer envelope</text>
  <text class="mono" x="540" y="198" text-anchor="middle" fill="white">coverage ≥ 0.90 · mean half-width: larger</text>
  <text class="sm" x="540" y="214" text-anchor="middle" fill="white">distribution-free guarantee · no model assumption</text>
  <text class="sm" x="540" y="228" text-anchor="middle" fill="white">pays with extra width for distributional robustness</text>

  <!-- Bottom note -->
  <text class="sub" x="360" y="256" text-anchor="middle">Rule: use fpca_tolerance_band when data fits a low-dimensional FPC model (tighter band)</text>
  <text class="sub" x="360" y="272" text-anchor="middle">use conformal_prediction_band when coverage must hold without model assumptions (wider)</text>
</svg>
