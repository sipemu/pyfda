<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="TSRVF: linearizing elastic analysis into a flat tangent space">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">TSRVF: Linearizing Elastic Analysis</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Transport curves to a reference so linear statistics apply again</text>

  <!-- Panel 1: a curve -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Curve on Manifold</text>
  <g transform="translate(44,110)">
    <path d="M8 118 C40 60 78 60 156 96" stroke="#adb5bd" stroke-width="1.2" fill="none" stroke-dasharray="4 4"/>
    <path d="M0 96 C40 44 84 130 120 70 C138 40 150 82 156 60" stroke="#495057" stroke-opacity=".4" stroke-width="1.6"/>
    <path d="M0 108 C40 56 84 118 120 82 C138 52 150 94 156 72" stroke="#495057" stroke-opacity=".4" stroke-width="1.6"/>
    <path d="M0 102 C40 50 84 124 120 76 C138 46 150 88 156 66" stroke="#495057" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <text class="sm" x="122" y="248" text-anchor="middle" fill="#6c757d">curved space</text>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#fd7e14">tsrvf_transform()</text>
  <text class="sm" x="360" y="118" text-anchor="middle">Transport to reference</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#f8d7b8"/>
    <text class="sm" x="12" y="16">SRVF representation</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#f8d7b8"/>
    <text class="sm" x="12" y="48">parallel transport</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#f8d7b8"/>
    <text class="sm" x="12" y="80">Karcher-mean base</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: tangent vectors in flat space -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#fd7e14">Flat Tangent Space</text>
  <g transform="translate(516,108)">
    <rect x="0" y="20" width="164" height="96" rx="4" fill="#fff" stroke="#f8d7b8"/>
    <line x1="82" y1="24" x2="82" y2="112" stroke="#e9ecef" stroke-width="1"/>
    <line x1="6" y1="68" x2="158" y2="68" stroke="#e9ecef" stroke-width="1"/>
    <circle cx="82" cy="68" r="4" fill="#fd7e14"/>
    <path d="M82 68 L124 40" stroke="#fd7e14" stroke-width="2"/><path d="M124 40 l-9 1 4 6z" fill="#fd7e14"/>
    <path d="M82 68 L48 44" stroke="#fd7e14" stroke-width="2"/><path d="M48 44 l8 -1 -3 6z" fill="#fd7e14"/>
    <path d="M82 68 L60 100" stroke="#fd7e14" stroke-width="2"/><path d="M60 100 l1 -8 6 4z" fill="#fd7e14"/>
    <path d="M82 68 L130 92" stroke="#fd7e14" stroke-width="2"/><path d="M130 92 l-8 -2 2 -6z" fill="#fd7e14"/>
  </g>
  <text class="sm" x="598" y="250" text-anchor="middle" fill="#6c757d">means, PCA valid</text>
</svg>
