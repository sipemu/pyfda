<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Robust Regression: Resisting Contamination" aria-labelledby="robust-regression-title robust-regression-desc">
  <title id="robust-regression-title">Robust Regression: Resisting Contamination</title>
  <desc id="robust-regression-desc">Robust regression down-weights outlier curves iteratively so that contaminating observations have reduced influence; the resulting coefficient function is closer to the true β(t) than ordinary least squares.</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Robust Regression: Resisting Contamination</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Down-weight outliers so β(t) stays true to the clean majority</text>

  <!-- Panel 1: contaminated curves -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Contaminated Curves</text>
  <g transform="translate(44,110)">
    <line x1="0" y1="120" x2="156" y2="120" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 80 C40 44 80 100 120 62 C138 48 150 68 156 60" stroke="#495057" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M0 88 C40 54 80 106 120 72 C138 56 150 78 156 70" stroke="#495057" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M0 84 C40 50 80 102 120 66 C138 52 150 74 156 64" stroke="#495057" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M0 40 C40 12 80 30 120 8 C138 4 150 16 156 10" stroke="#dc3545" stroke-width="2.4"/>
    <text class="sm" x="70" y="6" fill="#dc3545">outlier</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#fdeef0" stroke="#dc3545" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#dc3545">fregre_huber / l1()</text>
  <text class="sm" x="360" y="118" text-anchor="middle">Down-weight big residuals</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#f1b8bf"/>
    <text class="sm" x="12" y="16">Huber · k = 1.345</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#f1b8bf"/>
    <text class="sm" x="12" y="48">L1 · median · 50% BP</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#f1b8bf"/>
    <text class="sm" x="12" y="80">vs. OLS baseline</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: robust beta -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#fdeef0" stroke="#dc3545" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#dc3545">Robust β(t)</text>
  <text class="sm" x="598" y="112" text-anchor="middle">unaffected by the outlier</text>
  <g transform="translate(524,124)">
    <line x1="0" y1="60" x2="150" y2="60" stroke="#adb5bd" stroke-dasharray="3 3" stroke-width="1"/>
    <path d="M0 60 C30 6 60 6 78 60 C96 114 126 114 150 60" stroke="#adb5bd" stroke-width="3" stroke-dasharray="4 3" fill="none"/>
    <path d="M0 58 C30 12 60 12 76 58 C94 106 124 106 150 58" stroke="#dc3545" stroke-width="2.6" fill="none"/>
    <text class="sm" x="16" y="118" fill="#dc3545">robust</text>
    <text class="sm" x="82" y="118" fill="#adb5bd">OLS drift</text>
  </g>
</svg>
