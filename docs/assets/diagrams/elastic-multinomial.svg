<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Elastic Multinomial Classification — K one-vs-rest binary elastic classifiers combined via softmax">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>

  <!-- Title -->
  <text class="ttl" x="360" y="26" text-anchor="middle">Elastic Multinomial Classification (K = 3 classes)</text>
  <text class="sub" x="360" y="44" text-anchor="middle">K one-vs-rest binary elastic classifiers · scores combined via softmax into class probabilities</text>

  <!-- Input functional data panel -->
  <rect x="14" y="58" width="120" height="184" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="74" y="77" text-anchor="middle" fill="#495057">Functional</text>
  <text class="lab" x="74" y="92" text-anchor="middle" fill="#495057">Data</text>
  <text class="mono" x="74" y="110" text-anchor="middle" fill="#6c757d" font-size="10">X: (n, m)</text>
  <!-- Wavy input curves -->
  <path d="M26 128 C50 118 70 138 100 124 C118 116 128 124 134 120" stroke="#3f51b5" stroke-width="1.6" opacity="0.7"/>
  <path d="M26 142 C50 132 70 152 100 138 C118 130 128 138 134 134" stroke="#e8710a" stroke-width="1.6" opacity="0.7"/>
  <path d="M26 156 C50 146 70 166 100 152 C118 144 128 152 134 148" stroke="#198754" stroke-width="1.6" opacity="0.7"/>
  <path d="M26 170 C50 160 70 180 100 166 C118 158 128 166 134 162" stroke="#6c757d" stroke-width="1.0" opacity="0.5"/>
  <text class="sm" x="74" y="218" text-anchor="middle">SRSF transform</text>
  <text class="sm" x="74" y="230" text-anchor="middle">+ elastic align</text>

  <!-- Arrow from input to OvR models -->
  <line x1="134" y1="150" x2="156" y2="150" stroke="#495057" stroke-width="2.0"/>
  <polygon points="156,144 168,150 156,156" fill="#495057"/>

  <!-- OvR binary classifiers panel (orange accent) -->
  <rect x="168" y="58" width="256" height="184" rx="8" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="296" y="77" text-anchor="middle" fill="#fd7e14">One-vs-Rest Binary Classifiers</text>

  <!-- OvR model 1: class 0 (aa) -->
  <rect x="180" y="88" width="232" height="42" rx="6" fill="#f8f9fa" stroke="#3f51b5" stroke-width="1.4"/>
  <text class="mono" x="194" y="107" fill="#3f51b5" font-size="10">OvR 1</text>
  <text class="sm" x="296" y="103" text-anchor="middle" fill="#1a1a2e">class 0 (aa) vs rest</text>
  <text class="sm" x="296" y="119" text-anchor="middle" fill="#495057">elastic binary classifier → score s₁</text>

  <!-- OvR model 2: class 1 (ao) -->
  <rect x="180" y="138" width="232" height="42" rx="6" fill="#f8f9fa" stroke="#e8710a" stroke-width="1.4"/>
  <text class="mono" x="194" y="157" fill="#e8710a" font-size="10">OvR 2</text>
  <text class="sm" x="296" y="153" text-anchor="middle" fill="#1a1a2e">class 1 (ao) vs rest</text>
  <text class="sm" x="296" y="169" text-anchor="middle" fill="#495057">elastic binary classifier → score s₂</text>

  <!-- OvR model 3: class 2 (dcl) -->
  <rect x="180" y="188" width="232" height="42" rx="6" fill="#f8f9fa" stroke="#198754" stroke-width="1.4"/>
  <text class="mono" x="194" y="207" fill="#198754" font-size="10">OvR 3</text>
  <text class="sm" x="296" y="203" text-anchor="middle" fill="#1a1a2e">class 2 (dcl) vs rest</text>
  <text class="sm" x="296" y="219" text-anchor="middle" fill="#495057">elastic binary classifier → score s₃</text>

  <!-- Arrow from OvR to softmax -->
  <line x1="424" y1="150" x2="446" y2="150" stroke="#495057" stroke-width="2.0"/>
  <polygon points="446,144 458,150 446,156" fill="#495057"/>

  <!-- Softmax aggregation panel -->
  <rect x="458" y="88" width="122" height="142" rx="8" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="519" y="108" text-anchor="middle" fill="#fd7e14">Softmax</text>
  <text class="sm" x="519" y="126" text-anchor="middle">s₁, s₂, s₃</text>
  <line x1="480" y1="134" x2="558" y2="134" stroke="#ced4da" stroke-width="1.0"/>
  <text class="sm" x="519" y="150" text-anchor="middle" fill="#1a1a2e">P(y=k | x)</text>
  <text class="sm" x="519" y="166" text-anchor="middle" fill="#495057">= exp(sₖ)</text>
  <text class="sm" x="519" y="180" text-anchor="middle" fill="#495057">/ Σ exp(sⱼ)</text>
  <text class="mono" x="519" y="202" text-anchor="middle" fill="#6c757d" font-size="10">(n, K) probs</text>
  <text class="mono" x="519" y="218" text-anchor="middle" fill="#6c757d" font-size="10">argmax → class</text>

  <!-- Arrow from softmax to output -->
  <line x1="580" y1="150" x2="600" y2="150" stroke="#495057" stroke-width="2.0"/>
  <polygon points="600,144 612,150 600,156" fill="#495057"/>

  <!-- Output panel -->
  <rect x="612" y="88" width="94" height="142" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="659" y="108" text-anchor="middle" fill="#495057">Output</text>
  <text class="sm" x="659" y="130" text-anchor="middle">predicted</text>
  <text class="sm" x="659" y="144" text-anchor="middle">class (n,)</text>
  <line x1="626" y1="154" x2="692" y2="154" stroke="#ced4da" stroke-width="1.0"/>
  <text class="sm" x="659" y="170" text-anchor="middle">train</text>
  <text class="sm" x="659" y="184" text-anchor="middle">accuracy</text>
  <line x1="626" y1="194" x2="692" y2="194" stroke="#ced4da" stroke-width="1.0"/>
  <text class="sm" x="659" y="210" text-anchor="middle">proba</text>
  <text class="sm" x="659" y="222" text-anchor="middle">(n, K)</text>
</svg>
