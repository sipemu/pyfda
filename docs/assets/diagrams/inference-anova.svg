<svg xmlns="http://www.w3.org/2000/svg" fill="none" aria-label="One-way Functional ANOVA — between-group and within-group variation decomposition" role="img" viewBox="0 0 720 300"><style>.ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}</style><text x="360" y="28" class="ttl" text-anchor="middle">One-way Functional ANOVA — Variance Decomposition</text><text x="360" y="46" class="sub" text-anchor="middle">Total variation = Between-group (signal) + Within-group (noise)</text><rect width="310" height="200" x="22" y="60" fill="#f8f9fa" stroke="#3f51b5" stroke-width="1.5" rx="8"/><text x="177" y="82" fill="#3f51b5" class="lab" text-anchor="middle">Between-group</text><text x="177" y="96" fill="#3f51b5" class="sm" text-anchor="middle">group mean curves vs grand mean</text><path stroke="#495057" stroke-width="1" d="M48 100 48 240"/><path stroke="#495057" stroke-width="1" d="M48 240 316 240"/><path fill="none" stroke="#6c757d" stroke-dasharray="6 3" stroke-width="1.6" d="M48 178 Q100 178 160 178 Q220 178 316 178"/><text x="228" y="196" fill="#6c757d" class="sm">grand μ̄</text><path fill="none" stroke="#3f51b5" stroke-width="2.4" d="M48 138 Q100 130 160 134 Q220 138 316 136"/><text x="52" y="128" fill="#3f51b5" class="sm">μ̄₁</text><path fill="none" stroke="#e8710a" stroke-width="2.4" d="M48 208 Q100 214 160 210 Q220 206 316 208"/><text x="52" y="222" fill="#e8710a" class="sm">μ̄₂</text><path fill="none" stroke="#198754" stroke-width="2.4" d="M48 162 Q100 158 160 160 Q220 164 316 162"/><text x="52" y="156" fill="#198754" class="sm">μ̄₃</text><path stroke="#3f51b5" stroke-dasharray="3 2" stroke-width="1.4" d="M80 138 80 176"/><path stroke="#e8710a" stroke-dasharray="3 2" stroke-width="1.4" d="M104 208 104 178"/><text x="177" y="258" class="sm" text-anchor="middle">→ large when groups are well separated</text><rect width="310" height="200" x="388" y="60" fill="#f8f9fa" stroke="#e8710a" stroke-width="1.5" rx="8"/><text x="543" y="82" fill="#e8710a" class="lab" text-anchor="middle">Within-group</text><text x="543" y="96" fill="#e8710a" class="sm" text-anchor="middle">individual curves vs their group mean</text><path stroke="#495057" stroke-width="1" d="M414 100 414 240"/><path stroke="#495057" stroke-width="1" d="M414 240 682 240"/><path fill="none" stroke="#3f51b5" stroke-width="2.4" d="M414 148 Q470 144 530 148 Q590 152 682 148"/><path fill="none" stroke="#3f51b5" stroke-width="1" d="M414 138 Q470 134 530 140 Q590 144 682 140" opacity=".45"/><path fill="none" stroke="#3f51b5" stroke-width="1" d="M414 156 Q470 152 530 158 Q590 162 682 156" opacity=".45"/><path fill="none" stroke="#3f51b5" stroke-width="1" d="M414 130 Q470 128 530 134 Q590 136 682 130" opacity=".35"/><path fill="none" stroke="#3f51b5" stroke-width="1" d="M414 162 Q470 160 530 164 Q590 168 682 164" opacity=".35"/><path fill="none" stroke="#e8710a" stroke-width="2.4" d="M414 198 Q470 194 530 196 Q590 200 682 198"/><path fill="none" stroke="#e8710a" stroke-width="1" d="M414 188 Q470 186 530 188 Q590 192 682 190" opacity=".45"/><path fill="none" stroke="#e8710a" stroke-width="1" d="M414 208 Q470 204 530 206 Q590 210 682 208" opacity=".45"/><path fill="none" stroke="#e8710a" stroke-width="1" d="M414 182 Q470 180 530 184 Q590 186 682 184" opacity=".35"/><path fill="none" stroke="#e8710a" stroke-width="1" d="M414 214 Q470 210 530 212 Q590 216 682 214" opacity=".35"/><path stroke="#6c757d" stroke-width="1.4" d="M660 130 660 168"/><path stroke="#6c757d" stroke-width="1" d="M656 130 664 130"/><path stroke="#6c757d" stroke-width="1" d="M656 168 664 168"/><text x="666" y="150" fill="#6c757d" class="sm">σ₁</text><text x="543" y="258" class="sm" text-anchor="middle">→ small when curves cluster tightly</text><text x="356" y="170" fill="#495057" class="lab" text-anchor="middle">Total</text><text x="356" y="184" fill="#495057" class="sm" text-anchor="middle">= ∑ +</text></svg>