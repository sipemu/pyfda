<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Styling a functional sample with matplotlib">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Custom Plotting: Styling a Curve Family</text>
  <text class="sub" x="360" y="46" text-anchor="middle">fdars ships no plotting layer -- you draw curves with plain matplotlib</text>

  <!-- Panel 1: plain curve set -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">Plain Curve Set</text>
  <text class="sm" x="122" y="112" text-anchor="middle">fd.data, one line per row</text>
  <g transform="translate(44,124)">
    <line x1="0" y1="120" x2="156" y2="120" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 88 C40 50 80 100 120 60 C138 46 150 68 156 60" stroke="#adb5bd" stroke-width="1.5"/>
    <path d="M0 100 C40 66 80 82 120 74 C138 64 150 84 156 76" stroke="#adb5bd" stroke-width="1.5"/>
    <path d="M0 78 C40 58 80 92 120 52 C138 40 150 62 156 54" stroke="#adb5bd" stroke-width="1.5"/>
    <path d="M0 108 C40 82 80 66 120 88 C138 100 150 72 156 84" stroke="#adb5bd" stroke-width="1.5"/>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#eaf1ff" stroke="#0d6efd" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#0d6efd">ax.plot(...)</text>
  <text class="sm" x="360" y="118" text-anchor="middle">matplotlib idioms</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#b6d0ff"/>
    <text class="sm" x="12" y="16">colour by metadata</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#b6d0ff"/>
    <text class="sm" x="12" y="48">mean ± sd envelope</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#b6d0ff"/>
    <text class="sm" x="12" y="80">highlight median</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: styled figure -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#eaf1ff" stroke="#0d6efd" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#0d6efd">Styled Figure</text>
  <text class="sm" x="598" y="112" text-anchor="middle">mean ± sd band + median</text>
  <g transform="translate(520,124)">
    <line x1="0" y1="120" x2="156" y2="120" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 74 C40 46 80 84 120 48 C138 36 150 56 156 50 L156 82 C150 88 138 68 120 80 C80 116 40 78 0 106 Z" fill="#0d6efd" fill-opacity=".18"/>
    <path d="M0 66 C40 40 80 78 120 42 C138 30 150 50 156 44" stroke="#0d6efd" stroke-opacity=".3" stroke-width="1.4"/>
    <path d="M0 114 C40 86 80 90 120 88 C138 96 150 76 156 90" stroke="#0d6efd" stroke-opacity=".3" stroke-width="1.4"/>
    <path d="M0 90 C40 60 80 84 120 62 C138 52 150 66 156 62" stroke="#0d6efd" stroke-width="2.8" stroke-linecap="round"/>
  </g>
  <text class="sm" x="598" y="250" text-anchor="middle" fill="#6c757d">full control over aesthetics</text>
</svg>
