<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Functional Generalized Linear Model" aria-labelledby="functional-glm-title functional-glm-desc">
  <title id="functional-glm-title">Functional Generalized Linear Model</title>
  <desc id="functional-glm-desc">The functional GLM projects curves to FPC scores then fits a GLM with a family-specific link function: identity for Gaussian, logit for binomial, log for Poisson, and inverse for Gamma (note: not the log-link R default).</desc>
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>

  <!-- Title -->
  <text class="ttl" x="360" y="26" text-anchor="middle">Functional Generalized Linear Model</text>
  <text class="sub" x="360" y="44" text-anchor="middle">FPCA reduces curves to scores · GLM fits scores with a family-specific link</text>

  <!-- Stage 1: Functional data input -->
  <rect x="14" y="58" width="148" height="136" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="88" y="78" text-anchor="middle" fill="#495057">Functional data</text>
  <text class="mono" x="88" y="94" text-anchor="middle" fill="#6c757d" font-size="10">X: (n, m)</text>
  <!-- Wavy curves representing functional data -->
  <path d="M26 110 C50 100 70 120 90 108 C110 96 130 115 148 108" stroke="#3f51b5" stroke-width="1.6" opacity="0.7"/>
  <path d="M26 122 C50 112 70 132 90 120 C110 108 130 127 148 120" stroke="#e8710a" stroke-width="1.6" opacity="0.7"/>
  <path d="M26 134 C50 124 70 144 90 132 C110 120 130 139 148 132" stroke="#198754" stroke-width="1.6" opacity="0.7"/>
  <path d="M26 146 C50 136 70 156 90 144 C110 132 130 151 148 144" stroke="#6c757d" stroke-width="1.0" opacity="0.5"/>
  <path d="M26 158 C50 148 70 168 90 156 C110 144 130 163 148 156" stroke="#6c757d" stroke-width="1.0" opacity="0.5"/>
  <text class="sm" x="88" y="182" text-anchor="middle">n curves, m grid pts</text>

  <!-- Arrow 1: FPCA -->
  <line x1="162" y1="126" x2="200" y2="126" stroke="#495057" stroke-width="2.0"/>
  <polygon points="200,120 212,126 200,132" fill="#495057"/>
  <text class="sm" x="187" y="118" text-anchor="middle">FPCA</text>

  <!-- Stage 2: FPC Scores -->
  <rect x="212" y="58" width="148" height="136" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="286" y="78" text-anchor="middle" fill="#495057">FPC scores</text>
  <text class="mono" x="286" y="94" text-anchor="middle" fill="#6c757d" font-size="10">S: (n, K)</text>
  <!-- Score matrix visualization -->
  <rect x="232" y="103" width="18" height="12" rx="2" fill="#3f51b5" opacity="0.7"/>
  <rect x="254" y="103" width="18" height="12" rx="2" fill="#3f51b5" opacity="0.5"/>
  <rect x="276" y="103" width="18" height="12" rx="2" fill="#3f51b5" opacity="0.35"/>
  <rect x="232" y="119" width="18" height="12" rx="2" fill="#e8710a" opacity="0.7"/>
  <rect x="254" y="119" width="18" height="12" rx="2" fill="#e8710a" opacity="0.5"/>
  <rect x="276" y="119" width="18" height="12" rx="2" fill="#e8710a" opacity="0.35"/>
  <rect x="232" y="135" width="18" height="12" rx="2" fill="#198754" opacity="0.7"/>
  <rect x="254" y="135" width="18" height="12" rx="2" fill="#198754" opacity="0.5"/>
  <rect x="276" y="135" width="18" height="12" rx="2" fill="#198754" opacity="0.35"/>
  <rect x="232" y="151" width="18" height="12" rx="2" fill="#6c757d" opacity="0.4"/>
  <rect x="254" y="151" width="18" height="12" rx="2" fill="#6c757d" opacity="0.3"/>
  <rect x="276" y="151" width="18" height="12" rx="2" fill="#6c757d" opacity="0.2"/>
  <text class="sm" x="308" y="111" fill="#6c757d">PC₁</text>
  <text class="sm" x="308" y="127" fill="#6c757d">PC₂</text>
  <text class="sm" x="308" y="143" fill="#6c757d">PC₃</text>
  <text class="sm" x="286" y="178" text-anchor="middle">K = n_comp</text>

  <!-- Arrow 2: GLM fit -->
  <line x1="360" y1="126" x2="398" y2="126" stroke="#495057" stroke-width="2.0"/>
  <polygon points="398,120 410,126 398,132" fill="#495057"/>
  <text class="sm" x="385" y="118" text-anchor="middle">GLM fit</text>

  <!-- Stage 3: Link function dispatch (orange panel) -->
  <rect x="410" y="58" width="296" height="220" rx="10" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="558" y="78" text-anchor="middle" fill="#fd7e14">Link function by family</text>

  <!-- Gaussian branch -->
  <rect x="424" y="90" width="264" height="30" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.2"/>
  <text class="mono" x="452" y="109" fill="#3f51b5" font-size="10">gaussian</text>
  <text class="sm" x="516" y="109" text-anchor="start" fill="#495057">identity   g(μ) = μ</text>

  <!-- Binomial branch -->
  <rect x="424" y="128" width="264" height="30" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.2"/>
  <text class="mono" x="452" y="147" fill="#e8710a" font-size="10">binomial</text>
  <text class="sm" x="516" y="147" text-anchor="start" fill="#495057">logit   g(μ) = log(μ/1−μ)</text>

  <!-- Poisson branch -->
  <rect x="424" y="166" width="264" height="30" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.2"/>
  <text class="mono" x="452" y="185" fill="#198754" font-size="10">poisson</text>
  <text class="sm" x="516" y="185" text-anchor="start" fill="#495057">log   g(μ) = log(μ)</text>

  <!-- Gamma branch — HIGHLIGHTED as most important caveat -->
  <rect x="424" y="204" width="264" height="46" rx="6" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.8"/>
  <text class="mono" x="452" y="223" fill="#dc3545" font-size="10">gamma</text>
  <text class="sm" x="516" y="223" text-anchor="start" fill="#dc3545">inverse   g(μ) = 1/μ</text>
  <text class="sm" x="516" y="239" text-anchor="start" fill="#dc3545">≠ log-link (R default)</text>
</svg>
