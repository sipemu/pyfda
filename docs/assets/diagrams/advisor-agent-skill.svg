<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none" role="img" aria-label="Agent Skill execution flow: git-URL install then interpret, recommend (API-key gated), re-run, compare loop; contrasted with recommend-only Python API mode">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>

  <!-- Title -->
  <text class="ttl" x="360" y="28" text-anchor="middle">Agent Skill — Full Agentic Loop</text>
  <text class="sub" x="360" y="46" text-anchor="middle">git-URL install · interpret → recommend → re-run → compare · advise() optional / API-key gated</text>

  <!-- ===== Install banner ===== -->
  <rect x="24" y="60" width="672" height="44" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="sm" x="360" y="78" text-anchor="middle">Install (git-URL until fdars 3.0 ships extras to PyPI):</text>
  <text class="mono" x="360" y="96" text-anchor="middle" fill="#1a1a2e">pip install "fdars @ git+…"  mcp&gt;=2.0.0  anthropic&gt;=0.72.0  pydantic&gt;=2.0</text>

  <!-- ===== Agentic loop (orange, left+center) ===== -->
  <rect x="24" y="120" width="466" height="316" rx="12" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="257" y="142" text-anchor="middle" fill="#fd7e14">Agent Skill — agentic loop (interpret → re-run → compare)</text>

  <!-- Step 1: interpret -->
  <rect x="42" y="154" width="200" height="70" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="142" y="174" text-anchor="middle" fill="#495057">Step 1+3: interpret</text>
  <text class="mono" x="142" y="193" text-anchor="middle" fill="#1a1a2e">build_diagnostics(…)</text>
  <text class="sm" x="142" y="210" text-anchor="middle">offline · deterministic</text>

  <!-- Arrow interpret → recommend -->
  <line x1="242" y1="189" x2="270" y2="189" stroke="#fd7e14" stroke-width="2" marker-end="url(#arrorange)"/>

  <!-- Step 2: recommend (optional, API-key gated) -->
  <rect x="270" y="154" width="202" height="70" rx="10" fill="#fff4ea" stroke="#fd7e14" stroke-width="1.5"/>
  <text class="lab" x="371" y="174" text-anchor="middle" fill="#fd7e14">Step 4: recommend</text>
  <text class="mono" x="371" y="193" text-anchor="middle" fill="#1a1a2e">advise(diagnostics, …)</text>
  <text class="sm" x="371" y="210" text-anchor="middle" fill="#fd7e14">optional · ANTHROPIC_API_KEY</text>

  <!-- Arrow recommend → re-run (down) -->
  <line x1="371" y1="224" x2="371" y2="258" stroke="#fd7e14" stroke-width="2" marker-end="url(#arrorange)"/>

  <!-- Step 3: re-run -->
  <rect x="270" y="258" width="202" height="70" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="371" y="278" text-anchor="middle" fill="#495057">Step 2+5: re-run</text>
  <text class="mono" x="371" y="297" text-anchor="middle" fill="#1a1a2e">run_method(ds_id, …)</text>
  <text class="sm" x="371" y="314" text-anchor="middle">6 methods · returns r-&lt;hex&gt;</text>

  <!-- Arrow re-run → compare -->
  <line x1="270" y1="293" x2="242" y2="293" stroke="#fd7e14" stroke-width="2" marker-end="url(#arrorange)"/>

  <!-- Step 4: compare -->
  <rect x="42" y="258" width="200" height="70" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="142" y="278" text-anchor="middle" fill="#495057">Step 5: compare</text>
  <text class="mono" x="142" y="297" text-anchor="middle" fill="#1a1a2e">compare_run(…)</text>
  <text class="sm" x="142" y="314" text-anchor="middle">before/after delta (fdars-computed)</text>

  <!-- Loop-back arrow: compare → interpret (curved bottom) -->
  <path d="M142 328 Q142 384 257 384 Q371 384 371 328" stroke="#fd7e14" stroke-width="2" fill="none" marker-end="url(#arrorange)"/>
  <text class="sm" x="257" y="402" text-anchor="middle" fill="#fd7e14">loop back to interpret</text>

  <!-- ===== Python API exit (right panel) ===== -->
  <rect x="508" y="120" width="188" height="316" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="602" y="142" text-anchor="middle" fill="#495057">Python API</text>
  <text class="sm" x="602" y="160" text-anchor="middle">recommend-only</text>

  <rect x="522" y="172" width="160" height="70" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="602" y="192" text-anchor="middle" fill="#495057">build_diagnostics</text>
  <text class="sm" x="602" y="210" text-anchor="middle">offline · deterministic</text>

  <line x1="602" y1="242" x2="602" y2="258" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrgrey)"/>

  <rect x="522" y="258" width="160" height="70" rx="10" fill="#fff4ea" stroke="#f8d7b8" stroke-width="1.5"/>
  <text class="lab" x="602" y="278" text-anchor="middle" fill="#fd7e14">advise()</text>
  <text class="sm" x="602" y="296" text-anchor="middle">requires API key</text>

  <line x1="602" y1="328" x2="602" y2="344" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arrgrey)"/>

  <rect x="522" y="344" width="160" height="54" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="602" y="364" text-anchor="middle" fill="#495057">Advice</text>
  <text class="sm" x="602" y="382" text-anchor="middle" fill="#6c757d">returns and STOPS</text>
  <text class="sm" x="602" y="397" text-anchor="middle" fill="#6c757d">no re-run · no delta</text>

  <!-- Defs -->
  <defs>
    <marker id="arrorange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#fd7e14"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#495057"/>
    </marker>
    <marker id="arrgrey" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#6c757d"/>
    </marker>
  </defs>
</svg>
