<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Distance metrics: curve pairs to a distance matrix">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <text class="ttl" x="360" y="26" text-anchor="middle">Distance Metrics: Curves to a Distance Matrix</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Different metrics induce different geometries on the same sample</text>

  <!-- Panel 1: two curves -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#495057">A Pair of Curves</text>
  <text class="sm" x="122" y="112" text-anchor="middle">how far apart?</text>
  <g transform="translate(44,120)">
    <line x1="0" y1="110" x2="156" y2="110" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 82 C30 34 60 96 90 52 C114 20 136 76 156 44" stroke="#198754" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0 68 C30 96 60 40 90 84 C114 104 136 52 156 78" stroke="#fd7e14" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Arrow 1 -->
  <path d="M228 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M262 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 2: method -->
  <rect x="272" y="70" width="176" height="188" rx="12" fill="#eafaf1" stroke="#198754" stroke-width="1.5"/>
  <text class="mono" x="360" y="98" text-anchor="middle" fill="#198754" font-size="11">*_self_1d(data)</text>
  <text class="sm" x="360" y="118" text-anchor="middle">choose a geometry</text>
  <g transform="translate(292,132)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#fff" stroke="#bfe6d0"/>
    <text class="mono" x="12" y="16" fill="#198754" font-size="11">lp_self_1d</text>
    <rect x="0" y="32" width="136" height="24" rx="6" fill="#fff" stroke="#bfe6d0"/>
    <text class="mono" x="12" y="48" fill="#198754" font-size="11">dtw_self_1d</text>
    <rect x="0" y="64" width="136" height="24" rx="6" fill="#fff" stroke="#bfe6d0"/>
    <text class="mono" x="12" y="80" fill="#198754" font-size="10.5">hausdorff_self_1d</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M456 164 h34" stroke="#adb5bd" stroke-width="2"/>
  <path d="M490 164 l-9 -5 v10 z" fill="#adb5bd"/>

  <!-- Panel 3: output -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#eafaf1" stroke="#198754" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#198754">Distance Matrix</text>
  <text class="sm" x="598" y="112" text-anchor="middle">symmetric, zero diagonal</text>
  <!-- 5x5 heatmap -->
  <g transform="translate(548,122)" fill="#198754">
    <rect x="0" y="0" width="20" height="20"/><rect x="20" y="0" width="20" height="20" fill-opacity=".35"/><rect x="40" y="0" width="20" height="20" fill-opacity=".6"/><rect x="60" y="0" width="20" height="20" fill-opacity=".2"/><rect x="80" y="0" width="20" height="20" fill-opacity=".75"/>
    <rect x="0" y="20" width="20" height="20" fill-opacity=".35"/><rect x="20" y="20" width="20" height="20"/><rect x="40" y="20" width="20" height="20" fill-opacity=".25"/><rect x="60" y="20" width="20" height="20" fill-opacity=".55"/><rect x="80" y="20" width="20" height="20" fill-opacity=".3"/>
    <rect x="0" y="40" width="20" height="20" fill-opacity=".6"/><rect x="20" y="40" width="20" height="20" fill-opacity=".25"/><rect x="40" y="40" width="20" height="20"/><rect x="60" y="40" width="20" height="20" fill-opacity=".4"/><rect x="80" y="40" width="20" height="20" fill-opacity=".65"/>
    <rect x="0" y="60" width="20" height="20" fill-opacity=".2"/><rect x="20" y="60" width="20" height="20" fill-opacity=".55"/><rect x="40" y="60" width="20" height="20" fill-opacity=".4"/><rect x="60" y="60" width="20" height="20"/><rect x="80" y="60" width="20" height="20" fill-opacity=".3"/>
    <rect x="0" y="80" width="20" height="20" fill-opacity=".75"/><rect x="20" y="80" width="20" height="20" fill-opacity=".3"/><rect x="40" y="80" width="20" height="20" fill-opacity=".65"/><rect x="60" y="80" width="20" height="20" fill-opacity=".3"/><rect x="80" y="80" width="20" height="20"/>
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#198754" stroke-width="1"/>
  </g>
</svg>
