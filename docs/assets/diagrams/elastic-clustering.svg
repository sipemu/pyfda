<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Elastic clustering pipeline: raw curves to elastic distance matrix (elastic_self_distance_matrix) to distance-based clustering to cluster assignments and aligned mean curves">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Content centred on the 720x300 canvas (source was 700x250) -->
  <g transform="translate(10,25)">

  <!-- Step 1: Raw Curves (blue) -->
  <rect x="15" y="85" width="120" height="50" rx="8" fill="#e7f0fd" stroke="#4169E1" stroke-width="1.5"/>
  <text class="sm" x="75" y="114" text-anchor="middle" font-size="12" style="fill:#333">Raw Curves</text>
  <line x1="135" y1="110" x2="165" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 2: Elastic Distance Matrix (blue) -->
  <rect x="165" y="85" width="140" height="50" rx="8" fill="#e7f0fd" stroke="#4169E1" stroke-width="1.5"/>
  <text class="sm" x="235" y="106" text-anchor="middle" style="fill:#333">Elastic Distance</text>
  <text class="sm" x="235" y="122" text-anchor="middle" style="fill:#333">Matrix</text>
  <line x1="305" y1="110" x2="335" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 3: Clustering methods (blue) -->
  <rect x="335" y="85" width="140" height="50" rx="8" fill="#e7f0fd" stroke="#4169E1" stroke-width="1.5"/>
  <text class="sm" x="405" y="106" text-anchor="middle" style="fill:#333">Distance-Based</text>
  <text class="sm" x="405" y="122" text-anchor="middle" style="fill:#333">Clustering</text>
  <line x1="475" y1="110" x2="505" y2="110" stroke="#666" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 4: Results (green, two sub-boxes) -->
  <rect x="505" y="60" width="180" height="100" rx="8" fill="#f0faf0" stroke="#2E8B57" stroke-width="1.5"/>
  <text class="sm" x="595" y="90" text-anchor="middle" style="fill:#333">Cluster</text>
  <text class="sm" x="595" y="106" text-anchor="middle" style="fill:#333">Assignments</text>
  <line x1="530" y1="118" x2="660" y2="118" stroke="#2E8B57" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text class="sm" x="595" y="138" text-anchor="middle" style="fill:#333">Aligned Mean</text>
  <text class="sm" x="595" y="154" text-anchor="middle" style="fill:#333">Curves</text>

  <!-- Labels -->
  <text class="lab" x="235" y="45" text-anchor="middle" font-size="11" style="fill:#4169E1">COMPUTATION</text>
  <text class="lab" x="595" y="45" text-anchor="middle" font-size="11" style="fill:#2E8B57">RESULTS</text>

  </g>
</svg>
