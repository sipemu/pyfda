<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" role="img" aria-label="Functional Statistical Process Monitoring: learn an in-control FPCA model in Phase I, then chart Hotelling T-squared and SPE against control limits in Phase II">
  <style>
    .ttl{font:700 17px system-ui,-apple-system,sans-serif;fill:#1a1a2e}
    .sub{font:400 12px system-ui,sans-serif;fill:#6c757d}
    .lab{font:700 13px system-ui,sans-serif}
    .sm{font:400 11px system-ui,sans-serif;fill:#495057}
    .mono{font:600 12px ui-monospace,monospace}
  </style>
  <defs>
    <marker id="arrSPM" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7" fill="#adb5bd"/>
    </marker>
  </defs>

  <text class="ttl" x="360" y="26" text-anchor="middle">Functional Statistical Process Monitoring</text>
  <text class="sub" x="360" y="46" text-anchor="middle">Learn in-control variation with FPCA, then flag curves that depart from it</text>

  <!-- ===== Panel 1: Phase I baseline ===== -->
  <rect x="24" y="70" width="196" height="188" rx="12" fill="#eef4fd" stroke="#4A90D9" stroke-width="1.5"/>
  <text class="lab" x="122" y="94" text-anchor="middle" fill="#2C5F8A">Phase I — Baseline</text>
  <text class="mono" x="122" y="112" text-anchor="middle" fill="#2C5F8A" font-size="11">spm_phase1()</text>
  <g transform="translate(44,124)">
    <line x1="0" y1="110" x2="156" y2="110" stroke="#adb5bd" stroke-width="1.2"/>
    <path d="M0 82 C40 54 80 96 120 60 C138 46 150 70 156 62" stroke="#6c757d" stroke-opacity=".35" stroke-width="1.4"/>
    <path d="M0 90 C40 62 80 104 120 70 C138 56 150 80 156 72" stroke="#6c757d" stroke-opacity=".35" stroke-width="1.4"/>
    <path d="M0 74 C40 46 80 88 120 52 C138 38 150 62 156 54" stroke="#6c757d" stroke-opacity=".35" stroke-width="1.4"/>
    <path d="M0 98 C40 70 80 112 120 78 C138 64 150 88 156 80" stroke="#6c757d" stroke-opacity=".3" stroke-width="1.4"/>
    <path d="M0 86 C40 58 80 100 120 66 C138 52 150 76 156 68" stroke="#2C5F8A" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text class="sm" x="122" y="250" text-anchor="middle">in-control model: &#956;&#770;(t) + K PCs</text>

  <line x1="220" y1="164" x2="256" y2="164" stroke="#adb5bd" stroke-width="1.4" marker-end="url(#arrSPM)"/>

  <!-- ===== Panel 2: two statistics ===== -->
  <rect x="262" y="70" width="196" height="188" rx="12" fill="#fff8ec" stroke="#E6A020" stroke-width="1.5"/>
  <text class="lab" x="360" y="94" text-anchor="middle" fill="#B37700">Two Statistics</text>

  <rect x="278" y="106" width="164" height="60" rx="8" fill="#fff" stroke="#f0d6a6" stroke-width="1"/>
  <text class="lab" x="360" y="126" text-anchor="middle" fill="#B37700" font-size="12">Hotelling T&#178;</text>
  <text class="mono" x="360" y="144" text-anchor="middle" fill="#495057" font-size="11">&#931; &#958;&#8342;&#178; / &#955;&#8342;</text>
  <text class="sm" x="360" y="160" text-anchor="middle">shift inside FPC subspace</text>

  <rect x="278" y="172" width="164" height="60" rx="8" fill="#fff" stroke="#f0d6a6" stroke-width="1"/>
  <text class="lab" x="360" y="192" text-anchor="middle" fill="#B37700" font-size="12">SPE (Q)</text>
  <text class="mono" x="360" y="210" text-anchor="middle" fill="#495057" font-size="11">&#8747; x&#771;(t)&#178; dt</text>
  <text class="sm" x="360" y="226" text-anchor="middle">residual outside the model</text>

  <text class="sm" x="360" y="250" text-anchor="middle">control limits set at rate &#945;</text>

  <line x1="458" y1="164" x2="494" y2="164" stroke="#adb5bd" stroke-width="1.4" marker-end="url(#arrSPM)"/>

  <!-- ===== Panel 3: Phase II control chart ===== -->
  <rect x="500" y="70" width="196" height="188" rx="12" fill="#eef7f0" stroke="#2E8B57" stroke-width="1.5"/>
  <text class="lab" x="598" y="94" text-anchor="middle" fill="#2E8B57">Phase II — Monitor</text>
  <text class="mono" x="598" y="112" text-anchor="middle" fill="#2E8B57" font-size="11">spm_monitor()</text>
  <g transform="translate(520,124)">
    <!-- axes -->
    <line x1="0" y1="0" x2="0" y2="110" stroke="#adb5bd" stroke-width="1.2"/>
    <line x1="0" y1="110" x2="156" y2="110" stroke="#adb5bd" stroke-width="1.2"/>
    <!-- UCL -->
    <line x1="0" y1="34" x2="156" y2="34" stroke="#D55E00" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text class="sm" x="156" y="30" text-anchor="end" fill="#D55E00">UCL</text>
    <!-- statistic trajectory -->
    <polyline points="10,88 28,76 46,90 64,70 82,82 100,64 118,74 136,18 154,58" stroke="#adb5bd" stroke-width="1.2" fill="none"/>
    <!-- in-control points -->
    <circle cx="10" cy="88" r="3.2" fill="#2E8B57"/>
    <circle cx="28" cy="76" r="3.2" fill="#2E8B57"/>
    <circle cx="46" cy="90" r="3.2" fill="#2E8B57"/>
    <circle cx="64" cy="70" r="3.2" fill="#2E8B57"/>
    <circle cx="82" cy="82" r="3.2" fill="#2E8B57"/>
    <circle cx="100" cy="64" r="3.2" fill="#2E8B57"/>
    <circle cx="118" cy="74" r="3.2" fill="#2E8B57"/>
    <circle cx="154" cy="58" r="3.2" fill="#2E8B57"/>
    <!-- out-of-control alarm -->
    <circle cx="136" cy="18" r="4.2" fill="#D55E00"/>
    <text class="sm" x="132" y="12" text-anchor="end" fill="#D55E00">alarm</text>
  </g>
  <text class="sm" x="598" y="250" text-anchor="middle">T&#178; / SPE vs control limit</text>
</svg>
