name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "python/**"
      - "src/**"
      - "scripts/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install docs dependencies
        # maturin develop needs an activated virtualenv (same pattern as ci.yml).
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r docs/requirements.txt maturin
      - name: Build and install fdars (needed for build-time figures)
        run: |
          source .venv/bin/activate
          maturin develop --release
      - name: Lint SVG diagrams (SVGO)
        # FND-02 / D-02 / D-10: check-only gate, blocks on ALL diagrams.
        # Pinned to svgo@3.3.4 (NOT latest — v4 has a different CLI/config API).
        # The gate NEVER rewrites committed hand-authored SVGs: svgo runs in stdout
        # mode (--output -) only.
        #
        # Idempotence check, not a source-vs-output diff: svgo@3.3.4's XML serialiser
        # always normalises whitespace and attribute ordering regardless of plugin
        # settings, so a direct diff against the hand-formatted source always shows
        # cosmetic differences. Instead we run svgo twice and diff pass 2 against
        # pass 1 — a nonzero diff means the config would still transform the diagram
        # after the first pass (structural nonconformance).
        run: |
          FAILED=0
          for svg in docs/assets/diagrams/*.svg; do
            first=$(npx svgo@3.3.4 --config svgo.config.mjs --quiet --input "$svg" --output -)
            second=$(printf '%s' "$first" | npx svgo@3.3.4 --config svgo.config.mjs --quiet --input - --output -)
            if ! diff <(printf '%s' "$first") <(printf '%s' "$second") >/dev/null; then
              echo "SVGO: $svg is not stable under svgo.config.mjs (would be transformed)"
              FAILED=1
            fi
          done
          [ $FAILED -eq 0 ] || { echo "SVGO lint failed — fix diagrams above"; exit 1; }
      - name: Build and gate on figure errors
        # PYTHONPATH exposes scripts/docs_fig.py to markdown-exec code blocks.
        # Build once, then FAIL if any figure block silently errored (markdown-exec
        # renders a traceback in place without failing the build).
        env:
          PYTHONPATH: scripts
        run: |
          source .venv/bin/activate
          mkdocs build --strict
          python scripts/check_docs_figures.py site
      - name: Deploy
        # Publish the already-built site/ instead of rebuilding via gh-deploy
        # (ghp-import ships with mkdocs). Halves the job time.
        run: |
          source .venv/bin/activate
          ghp-import --no-jekyll --push --force --no-history --message "Deploy docs ${GITHUB_SHA::7}" site
