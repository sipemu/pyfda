name: Paper

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "python/fdars/_capability_map.json"
      - "python/fdars/_references_map.json"
      - "python/fdars/**"
      - "src/**"
      - "docs/data/**"
  pull_request:
    paths:
      - "paper/**"
      - "python/fdars/_capability_map.json"
      - "python/fdars/_references_map.json"
      - "python/fdars/**"
      - "src/**"
      - "docs/data/**"

jobs:
  paper:
    name: Paper pipeline + PDF compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Create venv and build fdars (maturin develop)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy pandas scipy scikit-learn matplotlib
          maturin develop --release

      - name: Regenerate figures (PIPE-02 determinism gate)
        env:
          PYTHONPATH: scripts:paper/code
        run: |
          . .venv/bin/activate
          python paper/code/gen_figures.py

      - name: Assert figures byte-stable (same-environment determinism; PIPE-02 / CASE SC-5)
        env:
          PYTHONPATH: scripts:paper/code
        run: |
          . .venv/bin/activate
          # SC-5 is a SAME-ENVIRONMENT reproducibility guarantee. matplotlib PDF bytes
          # vary across FreeType/font/platform versions, so CI-regenerated figures are
          # NOT byte-identical to the locally-committed canonical ones (expected — the
          # residual risk flagged in the milestone). We therefore do NOT diff against the
          # committed figures; instead we prove the pipeline is deterministic *within this
          # runner*: the "Regenerate figures" step above produced run #1; regenerate once
          # more and require byte-identical output run-to-run (catches unseeded RNG / time
          # dependence). Then restore the committed canonical figures for the compile.
          mkdir -p /tmp/figs_run1
          for f in paper/figures/*.pdf; do cp -f "$f" "/tmp/figs_run1/$(basename "$f")"; done
          python paper/code/gen_figures.py
          for f in paper/figures/*.pdf; do
            cmp -s "$f" "/tmp/figs_run1/$(basename "$f")" || { echo "NON-DETERMINISTIC (same-env): $(basename "$f")"; exit 1; }
          done
          echo "SAME_ENV_DETERMINISTIC_OK"
          git checkout -- paper/figures/

      - name: Assert coverage macros (PIPE-03 drift gate)
        run: |
          . .venv/bin/activate
          python paper/code/assert_coverage.py --check

      - name: Assert refs.bib not stale (PIPE-04 drift gate)
        run: |
          . .venv/bin/activate
          python paper/code/gen_refs_bib.py --check

      - name: Check comparison traceability + fdars grounding (COMP)
        run: |
          . .venv/bin/activate
          python paper/code/check_comparison.py

      - name: Assert snippets not stale (MANU-05 / GATE-02 drift gate)
        run: |
          . .venv/bin/activate
          PYTHONPATH=scripts:paper/code python paper/code/gen_snippets.py --check

      - name: Setup tectonic
        uses: wtfjoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f  # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile PDF (GATE-01)
        env:
          SOURCE_DATE_EPOCH: "0"
        run: tectonic paper/paper.tex
