name: Paper

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "python/fdars/_capability_map.json"
      - "python/fdars/_references_map.json"
      - "python/fdars/**"
      - "src/**"
      - "docs/data/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - "python/fdars/_capability_map.json"
      - "python/fdars/_references_map.json"
      - "python/fdars/**"
      - "src/**"
      - "docs/data/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

jobs:
  paper:
    name: Paper pipeline + PDF compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Create venv and build fdars (maturin develop)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy pandas scipy scikit-learn matplotlib
          maturin develop --release

      - name: Regenerate figures (PIPE-02 determinism gate)
        env:
          PYTHONPATH: scripts:paper/code
        run: |
          . .venv/bin/activate
          python paper/code/gen_figures.py

      - name: Assert figures byte-stable (same-environment determinism; PIPE-02 / CASE SC-5)
        env:
          PYTHONPATH: scripts:paper/code
        run: |
          . .venv/bin/activate
          # SC-5 is a SAME-ENVIRONMENT reproducibility guarantee. matplotlib PDF bytes
          # vary across FreeType/font/platform versions, so CI-regenerated figures are
          # NOT byte-identical to the locally-committed canonical ones (expected — the
          # residual risk flagged in the milestone). We therefore do NOT diff against the
          # committed figures; instead we prove the pipeline is deterministic *within this
          # runner*: the "Regenerate figures" step above produced run #1; regenerate once
          # more and require byte-identical output run-to-run (catches unseeded RNG / time
          # dependence). Then restore the committed canonical figures for the compile.
          mkdir -p /tmp/figs_run1
          for f in paper/figures/*.pdf; do cp -f "$f" "/tmp/figs_run1/$(basename "$f")"; done
          python paper/code/gen_figures.py
          for f in paper/figures/*.pdf; do
            cmp -s "$f" "/tmp/figs_run1/$(basename "$f")" || { echo "NON-DETERMINISTIC (same-env): $(basename "$f")"; exit 1; }
          done
          echo "SAME_ENV_DETERMINISTIC_OK"
          git checkout -- paper/figures/

      - name: Assert coverage macros (PIPE-03 drift gate)
        run: |
          . .venv/bin/activate
          python paper/code/assert_coverage.py --check

      - name: Assert refs.bib not stale (PIPE-04 drift gate)
        run: |
          . .venv/bin/activate
          python paper/code/gen_refs_bib.py --check

      - name: Check comparison traceability + fdars grounding (COMP)
        run: |
          . .venv/bin/activate
          python paper/code/check_comparison.py

      - name: Assert snippets not stale (MANU-05 / GATE-02 drift gate)
        run: |
          . .venv/bin/activate
          PYTHONPATH=scripts:paper/code python paper/code/gen_snippets.py --check

      - name: Setup tectonic
        uses: wtfjoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f  # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile PDF (GATE-01)
        env:
          SOURCE_DATE_EPOCH: "0"
        run: tectonic paper/paper.tex

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/paper.pdf
          if-no-files-found: error

  arxiv:
    name: arXiv bundle (real pdflatex+bibtex) + self-contained compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arXiv compiles with pdflatex+bibtex on TeX Live (NOT tectonic). This job
      # exercises that exact toolchain so the bundle is verified against arXiv's
      # real behaviour, not just our tectonic proxy (GATE-03). All packages used
      # by paper.tex ship in TeX Live; no local .sty is bundled.
      - name: Install TeX Live (arXiv-equivalent toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science texlive-pictures latexmk

      # Real pdflatex + bibtex passes. latexmk drives bibtex automatically for
      # \bibliography{refs,refs_manual}, producing paper.bbl — the file arXiv
      # needs pre-generated (it does not reliably run bibtex for two databases).
      - name: Compile with pdflatex+bibtex (produces paper.bbl)
        working-directory: paper
        env:
          SOURCE_DATE_EPOCH: "0"
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error paper.tex

      - name: Assert no undefined citations/references
        working-directory: paper
        run: |
          if grep -E "Citation '.*' (on page .* )?undefined|There were undefined references" paper.log; then
            echo "FAIL: undefined citations/references"; exit 1
          fi
          echo "CITATIONS_OK"

      - name: Assert .bbl resolves every \cite key
        working-directory: paper
        run: |
          test -f paper.bbl || { echo "FAIL: paper.bbl not produced"; exit 1; }
          python3 - <<'PY'
          import re, sys
          tex = ""
          import glob
          for f in ["paper.tex"] + glob.glob("sections/*.tex"):
              tex += open(f, encoding="utf-8", errors="replace").read()
          keys = set()
          for m in re.finditer(r"\\cite[a-z]*\*?(?:\[[^\]]*\])*\{([^}]*)\}", tex):
              keys |= {k.strip() for k in m.group(1).split(",") if k.strip()}
          bbl = open("paper.bbl", encoding="utf-8", errors="replace").read()
          bibitems = set(re.findall(r"\\bibitem(?:\[[^\]]*\])?\{([^}]*)\}", bbl))
          missing = sorted(keys - bibitems)
          print(f"{len(keys)} cite key(s); {len(bibitems)} bibitem(s) in .bbl")
          if missing:
              print("FAIL: keys with no .bbl entry:", missing); sys.exit(1)
          print("BBL_RESOLVES_ALL_CITES")
          PY

      - name: Build arXiv tarball
        run: make arxiv

      # Simulate arXiv: extract the tarball into a clean dir and compile with
      # pdflatex alone. With paper.bbl present, no bibtex run is needed — exactly
      # arXiv's behaviour. Proves the bundle is self-contained (no path leaks).
      - name: Verify tarball compiles standalone (simulates arXiv)
        run: |
          rm -rf /tmp/arxiv-verify && mkdir -p /tmp/arxiv-verify
          tar -xzf paper/arxiv-submission.tar.gz -C /tmp/arxiv-verify
          cd /tmp/arxiv-verify
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          test -f paper.pdf || { echo "FAIL: standalone compile produced no PDF"; exit 1; }
          if grep -E "Citation '.*' (on page .* )?undefined" paper.log; then
            echo "FAIL: undefined citation in standalone bundle"; exit 1
          fi
          echo "STANDALONE_BUNDLE_OK"

      - name: Upload arXiv bundle + standalone PDF
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-bundle
          path: |
            paper/arxiv-submission.tar.gz
            /tmp/arxiv-verify/paper.pdf
          if-no-files-found: error

      # Line-overflow gate LAST so artifacts upload even if it trips. Prints the
      # offending source lines, then fails if any overfull \hbox exceeds 20pt.
      - name: Assert no large overfull hboxes (>20pt)
        working-directory: paper
        run: |
          python3 - <<'PY'
          import re, sys
          log = open("paper.log", encoding="utf-8", errors="replace").read()
          mags = sorted((float(m) for m in re.findall(r"Overfull \\hbox \(([0-9.]+)pt", log)), reverse=True)
          print("overfull \\hbox magnitudes (pt):", [round(m, 1) for m in mags])
          big = [m for m in mags if m > 20.0]
          print(f"total overfull: {len(mags)}; > 20pt: {len(big)}")
          # Print context around each large overfull for diagnosis.
          for m in re.finditer(r"Overfull \\hbox \(([0-9.]+)pt[^\n]*\n(.*)", log):
              if float(m.group(1)) > 20.0:
                  print("---", m.group(1), "pt ---")
                  print(m.group(2)[:300])
          sys.exit(1 if big else 0)
          PY
