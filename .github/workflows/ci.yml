name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test-rust:
    name: Rust tests (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.83"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo test

  test-python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: py${{ matrix.python-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin numpy pandas pytest pyyaml pytest-asyncio
      - name: Build and install
        run: |
          source .venv/bin/activate
          maturin develop --release
      - name: Install provider extras (Python 3.9 — no gemini/mcp)
        if: matrix.python-version == '3.9'
        run: |
          source .venv/bin/activate
          pip install -e ".[advisor,openai,ollama]"
      - name: Install provider extras (Python 3.10+ — all-providers + mcp)
        if: matrix.python-version != '3.9'
        run: |
          source .venv/bin/activate
          pip install -e ".[all-providers,mcp]"
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v

  sklearn-compliance:
    name: sklearn compliance (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the FND-02 guard (test_fdars_init_unchanged) diffs HEAD
          # against the pre-Phase-55 base commit, which a shallow clone omits
          # (git then exits 128 instead of 0/1, tripping a false failure).
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sklearn-py${{ matrix.python-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin numpy pandas pytest
      - name: Build and install
        run: |
          source .venv/bin/activate
          maturin develop --release
      - name: Install sklearn extra
        # Two-step pattern is intentional: `maturin develop --release` builds
        # and installs the native extension in editable mode (Rust compiled
        # once, release-optimised).  The subsequent `pip install -e ".[sklearn]"`
        # only resolves and installs the pure-Python extras declared under
        # [project.optional-dependencies.sklearn] (scikit-learn, etc.) — it does
        # NOT re-trigger a Rust rebuild because the native extension is already
        # installed in the venv and maturin's build backend is a no-op for an
        # already-built, up-to-date extension.
        run: |
          source .venv/bin/activate
          pip install -e ".[sklearn]"
      - name: Run sklearn compliance tests
        run: |
          source .venv/bin/activate
          pytest tests/sklearn/ -v

  smoke-bare-venv:
    name: Bare-venv smoke (no provider extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create virtualenv and install base deps only
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin numpy pandas
      - name: Build and install base package (no extras)
        run: |
          source .venv/bin/activate
          maturin develop --release
      - name: Run bare-venv smoke test
        run: |
          source .venv/bin/activate
          python scripts/bare_venv_smoke.py
